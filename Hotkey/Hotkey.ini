; =============================================================================
;  Raintile - close key
;
;  Invisible mini-skin that registers CloseHotKey (Esc) with the HotKey plugin.
;  Do not load it by hand: the main skin activates it when the launcher is
;  shown and deactivates it when it is hidden, so the key is not taken away
;  from other applications while the launcher is closed.
; =============================================================================

[Rainmeter]
Update=-1

[Variables]
@Include=#@#Settings.inc
@IncludeUser=#SETTINGSPATH#Raintile\Settings.inc

[MeasureCloseKey]
Measure=Plugin
Plugin=HotKey
HotKey=#CloseHotKey#
; closes the search if open, otherwise hides the launcher
KeyDownAction=[!CommandMeasure MeasureScript "Escape()" "#ROOTCONFIG#"]

; A skin needs at least one meter: a transparent pixel
[MeterDummy]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
