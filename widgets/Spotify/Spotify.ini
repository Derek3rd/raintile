; Spotify: a Raintile custom widget (Widget=custom, Param=Spotify).
; The song playing in Spotify: its cover fills the tile, a bar along the
; bottom shows the time (a click there moves in the song). With the mouse
; over the tile (or the highlight of the keys or the pad on it: OnFocus) the
; controls show over the cover: the title and the artist, previous, play /
; pause, next, the heart (Liked Songs), the times and a button that opens
; Spotify. The keys and the pad go from control to control; Enter / A
; presses one, left and right on the bar move 10 seconds.
;
; Needs Spicetify with its WebNowPlaying extension: from Spotify it connects
; to the widget's script, Spotify.ps1, a small WebSocket server on this PC
; only (127.0.0.1, the Port setting), running only while the widget is on
; screen (OnShow, OnHide). Another WebNowPlaying (a skin with its plugin)
; must not run at the same time: they would share the port.

[Metadata]
Name=Spotify
Information=The song playing in Spotify with its cover, the controls and the time. Needs Spicetify with its WebNowPlaying extension (and no other WebNowPlaying skin loaded).

[Option:Port]
Label=Port
Kind=number
Default=8974
Help=Where Spicetify's WebNowPlaying extension connects: 8974 unless you changed it there.

; Sizes, from the tile's: SB the play buttons, SR their row, SL the heart,
; SO the open button, SF the text, SH the bar
[Variables]
SB=(#WIDGETH#*0.22)
SR=(#WIDGETH#*0.38)
SL=(#WIDGETH#*0.14)
SO=(Max(16,#WIDGETH#*0.11))
SF=(Clamp(#WIDGETH#/22,8,14))
SH=(Max(3,#WIDGETH#*0.018))
SCmd=#WIDGETPATH#cmd_#WIDGET:Server#.ini
SShow=[!ShowMeterGroup "#WIDGET:Cover#Ctl"][!Redraw]
SHide=[!HideMeterGroup "#WIDGET:Cover#Ctl"][!Redraw]

[Raintile]
OnShow=[!WriteKeyValue Cmd Do show "#SCmd#"][!CommandMeasure #WIDGET:Server# "Run"]
OnHide=[!WriteKeyValue Cmd Do quit "#SCmd#"]#SHide#
OnFocus=#SShow#
OnBlur=#SHide#

[Server]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#Spotify.ps1" -Config "#CURRENTCONFIG#" -Section "#WIDGET:Server#" -Cmd "#SCmd#" -Port "#OPTION:Port#" -Flag "#@#Generated\DashOn.txt" -Text "#TextColor#" -Accent "#AccentColor#"
State=Hide
OutputType=UTF8

; Set by Spotify.ps1: how far the song is, in %
[Progress]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Without a cover (nothing playing, a local file): a note glyph
[NoCover]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#WIDGETW#,#WIDGETH# | Fill Color 255,255,255,12 | StrokeWidth 0

[NoCoverGlyph]
Meter=String
X=(#WIDGETW#/2)
Y=(#WIDGETH#*0.42)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#WIDGETH#*0.16)
FontColor=#TextDimColor#
AntiAlias=1
Text=[\xE8D6]

[Status]
Meter=String
X=(#WIDGETW#/2)
Y=(#WIDGETH#*0.62)
W=(#WIDGETW#-24)
StringAlign=CenterCenter
ClipString=2
FontFace=#FontFace#
FontSize=#SF#
FontColor=#TextDimColor#
AntiAlias=1
Text=Starting...

; The cover, cropped to fill the tile; the mouse over it shows the controls
[Cover]
Meter=Image
X=0
Y=0
W=#WIDGETW#
H=#WIDGETH#
PreserveAspectRatio=2
SolidColor=0,0,0,1
MouseOverAction=#SShow#
MouseLeaveAction=#SHide#

; The controls (group <Cover>Ctl: hidden until the mouse or the keys come)
[Shade]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#WIDGETW#,#WIDGETH# | Fill Color 0,0,0,170 | StrokeWidth 0
Group=#WIDGET:Cover#Ctl
Hidden=1

[Title]
Meter=String
X=10
Y=8
W=(#WIDGETW#-#SO#-26)
ClipString=1
FontFace=#FontFace#
FontSize=#SF#
FontWeight=700
FontColor=#TextColor#
AntiAlias=1
Group=#WIDGET:Cover#Ctl
Hidden=1

[Artist]
Meter=String
X=10
Y=(8+#SF#*1.7)
W=(#WIDGETW#-#SO#-26)
ClipString=1
FontFace=#FontFace#
FontSize=(#SF#*0.85)
FontColor=#TextDimColor#
AntiAlias=1
Group=#WIDGET:Cover#Ctl
Hidden=1

; Each button: a part (where the highlight goes, and the click) and its glyph
; (Segoe MDL2 Assets) over it
[Open]
Meter=Shape
X=(#WIDGETW#-#SO#-8)
Y=8
Shape=Rectangle 0,0,#SO#,#SO#,4 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=["spotify:"]
ToolTipText=Open Spotify
Group=#WIDGET:Cover#Ctl
Hidden=1

[OpenGlyph]
Meter=String
X=(#WIDGETW#-8-#SO#/2)
Y=(8+#SO#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SO#*0.45)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE8A7]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Previous]
Meter=Shape
X=(#WIDGETW#/2-#SB#*1.6)
Y=#SR#
Shape=Rectangle 0,0,#SB#,#SB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do previous "#SCmd#"]
Group=#WIDGET:Cover#Ctl
Hidden=1

[PreviousGlyph]
Meter=String
X=(#WIDGETW#/2-#SB#*1.1)
Y=(#SR#+#SB#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SB#*0.4)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE892]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Play]
Meter=Shape
X=(#WIDGETW#/2-#SB#/2)
Y=#SR#
Shape=Rectangle 0,0,#SB#,#SB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do playpause "#SCmd#"]
Group=#WIDGET:Cover#Ctl
Hidden=1

[PlayGlyph]
Meter=String
X=(#WIDGETW#/2)
Y=(#SR#+#SB#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SB#*0.5)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE768]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Next]
Meter=Shape
X=(#WIDGETW#/2+#SB#*0.6)
Y=#SR#
Shape=Rectangle 0,0,#SB#,#SB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do next "#SCmd#"]
Group=#WIDGET:Cover#Ctl
Hidden=1

[NextGlyph]
Meter=String
X=(#WIDGETW#/2+#SB#*1.1)
Y=(#SR#+#SB#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SB#*0.4)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE893]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Pos]
Meter=String
X=10
Y=(#WIDGETH#*0.81)
StringAlign=LeftCenter
FontFace=#FontFace#
FontSize=#SF#
FontColor=#TextColor#
AntiAlias=1
Text=0:00
Group=#WIDGET:Cover#Ctl
Hidden=1

[Dur]
Meter=String
X=(#WIDGETW#-10)
Y=(#WIDGETH#*0.81)
StringAlign=RightCenter
FontFace=#FontFace#
FontSize=#SF#
FontColor=#TextColor#
AntiAlias=1
Text=0:00
Group=#WIDGET:Cover#Ctl
Hidden=1

[Like]
Meter=Shape
X=(#WIDGETW#/2-#SL#/2)
Y=(#WIDGETH#*0.81-#SL#/2)
Shape=Rectangle 0,0,#SL#,#SL#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do like "#SCmd#"]
ToolTipText=Liked Songs
Group=#WIDGET:Cover#Ctl
Hidden=1

[LikeGlyph]
Meter=String
X=(#WIDGETW#/2)
Y=(#WIDGETH#*0.81)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SL#*0.5)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE006]
Group=#WIDGET:Cover#Ctl
Hidden=1

; The time: a bar along the bottom, always; over it, a strip where a click
; moves in the song (a part: left and right move 10 seconds)
[BarBack]
Meter=Shape
X=0
Y=(#WIDGETH#-#SH#)
Shape=Rectangle 0,0,#WIDGETW#,#SH# | Fill Color 255,255,255,40 | StrokeWidth 0

[Bar]
Meter=Bar
MeasureName=Progress
X=0
Y=(#WIDGETH#-#SH#)
W=#WIDGETW#
H=#SH#
BarOrientation=Horizontal
BarColor=#AccentColor#

[Seek]
Meter=Shape
X=0
Y=(#WIDGETH#*0.92)
Shape=Rectangle 0,0,#WIDGETW#,(#WIDGETH#*0.08) | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do "seek $MouseX:%$" "#SCmd#"]
KeyLeftAction=[!WriteKeyValue Cmd Do "step -10" "#SCmd#"]
KeyRightAction=[!WriteKeyValue Cmd Do "step 10" "#SCmd#"]
MouseOverAction=#SShow#
