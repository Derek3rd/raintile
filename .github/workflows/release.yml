# Builds the Options program (src/Options, RaintileOptions.exe) and the
# .rmskin package with it (tools/build_rmskin.py), and attaches the package to
# the release when a release is published. On a pull request, or run by hand
# (Actions > Release package > Run workflow), it only builds them, as a
# downloadable artifact to test.
#
# The release tag should be the version, e.g. v1.0.3, the same as Version= in
# Raintile.ini: if they differ the build stops, before attaching anything.

name: Release package

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the pages of the window are written in Scripts/Options.ps1: the
      # program's copy (SchemaData.cs) must match it
      - name: Check the Options schema
        run: python3 tools/gen_options_schema.py --check

      - name: Build the Options program
        run: |
          dotnet build src/Options/RaintileOptions.csproj -c Release -o build/options
          mkdir -p @Resources/Bin
          cp build/options/RaintileOptions.exe @Resources/Bin/

      - name: Build the .rmskin
        env:
          # passed through the environment, not pasted into the script
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            python3 tools/build_rmskin.py --version "$TAG"
          else
            python3 tools/build_rmskin.py
          fi

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.rmskin --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmskin
          path: dist/*.rmskin
