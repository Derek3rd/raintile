FontFace=#FontFace#
FontSize=#AF#
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1
Hidden=((([Count]<1)+((#ATop#+1*#ARowH#)>(#WIDGETH#-4)))>0)

[Pct1]
Meter=String
X=(#WIDGETW#-#AP#)
Y=((#ATop#+0*#ARowH#)+#AF#*0.35)
StringAlign=Right
FontFace=#FontFace#
FontSize=(#AF#*0.85)
FontColor=#TextDimColor#
