; =============================================================================
;  Raintile - typing in the search bar
;
;  Invisible mini-skin that registers the keys used to type a search with the
;  HotKey plugin: letters, digits (also on the numeric keypad), space, - and .,
;  Backspace, Enter (done) and Esc (cancel). Do not load it by hand: the main
;  skin activates it only while the search bar is being typed in, so the
;  results follow every key; then it turns it off again.
; =============================================================================

[Rainmeter]
Update=-1

[MeasureKeyA]
Measure=Plugin
Plugin=HotKey
HotKey=A
KeyDownAction=[!CommandMeasure MeasureScript "TypeKey('a')" "#ROOTCONFIG#"]

