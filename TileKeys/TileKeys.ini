; =============================================================================
;  Raintile - tile hot keys while the launcher is open
;
;  Invisible mini-skin with the hot keys of the tiles (HotKey= in the category
;  files) when TileKeysWhen=Open: the main skin activates it when the launcher
;  is shown and deactivates it when it is hidden, so those keys are not taken
;  away from other programs while it is closed (or open without the focus).
;  Do not load it by hand. The measures are written by the script to
;  @Resources\Generated\TileKeys.inc.
;  With TileKeysWhen=Always the keys are in the main skin instead.
; =============================================================================

[Rainmeter]
Update=-1

@IncludeKeys=#@#Generated\TileKeys.inc

[MeterNothing]
Meter=String
Hidden=1
