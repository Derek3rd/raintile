; BigClock: a Raintile custom widget (Widget=custom, Param=BigClock).
; The time in big letters, with the day and the date under it. It fills the
; tile: #WIDGETW# and #WIDGETH# are the size of the tile, in pixels.

[Variables]
BigClockColor=255,255,255
BigClockDim=255,255,255,150

[MeasureTime]
Measure=Time
Format=%H:%M
UpdateDivider=1

[MeasureDay]
Measure=Time
Format=%A, %#d %B

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=(#WIDGETW#/2)
Y=(#WIDGETH#/2 - #WIDGETH#/7)
StringAlign=CenterCenter
FontFace=Segoe UI Light
FontSize=(#WIDGETH#/5)
FontColor=#BigClockColor#
AntiAlias=1
Text=%1

[MeterDay]
Meter=String
MeasureName=MeasureDay
X=(#WIDGETW#/2)
Y=(#WIDGETH#/2 + #WIDGETH#/5)
StringAlign=CenterCenter
FontFace=Segoe UI
FontSize=(#WIDGETH#/16)
FontColor=#BigClockDim#
AntiAlias=1
Text=%1
