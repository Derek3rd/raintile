; Modrinth: a Raintile custom widget (Widget=custom, Param=Modrinth).
; The instances of Modrinth App, the last played first, with their icons:
; a click starts one. Give the tile more cells for more rows (Size=1x2).
;
; When its category comes on screen, Raintile runs OnShow: the RunCommand
; measure below starts Modrinth.ps1, which reads Modrinth App's database
; (read only) into list.txt and, when done, calls WidgetChanged(): Raintile
; draws the rows of list.txt (List=), each a part of the tile.

[Option:ShowTitle]
Label=Title
Kind=bool
Default=1
Help=A title at the top left of the tile, the rows under it.

[Option:Title]
Label=Title text
When=ShowTitle=1
Default=Modrinth
Help=What the title says.

[Raintile]
OnShow=[!CommandMeasure #WIDGET:Read# "Run"]
List=list.txt
ListY=(#OPTION:ShowTitle#*(Clamp(#WIDGETH#/18,9,20)*2+12)+(1-#OPTION:ShowTitle#)*7)

[Read]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#Modrinth.ps1" -Out "#WIDGETPATH#list.txt"
State=Hide
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureScript "WidgetChanged()"]

; The title, small and dimmed at the top left like the ones of the system
; widgets (Raintile writes none on a custom widget); the rows start under it
; (ListY= above, the same size: the title's font and two lines of it). Its
; text and whether it shows are settings of the widget (Options > Widgets).
[Title]
Meter=String
X=12
Y=10
W=(#WIDGETW#-24)
ClipString=1
FontFace=#FontFace#
FontSize=(Clamp(#WIDGETH#/18,9,20))
FontColor=#TextDimColor#
AntiAlias=1
Text=#OPTION:Title#
Hidden=(1-#OPTION:ShowTitle#)
