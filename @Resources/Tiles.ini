; =============================================================================
;  Tile di Raintile
;
;  [Raintile]
;  Categories=   ordine delle categorie nel menu, separate da |
;                (una categoria usata da una tile ma non elencata qui viene
;                aggiunta in fondo)
;
;  Ogni altra sezione e' una tile; le tile compaiono nell'ordine del file.
;    Category=    categoria di appartenenza (obbligatoria)
;    Command=     cosa eseguire al click: un programma, un URL, un percorso,
;                 oppure uno o piu' bang di Rainmeter tra parentesi quadre.
;                   Command="C:\Program Files\App\app.exe" --argomento
;                   Command=steam://rungameid/2344520
;                   Command=https://github.com
;                   Command=[!ActivateConfig "Raintile"]
;    Background=  immagine di sfondo (riempie la tile, ritagliata se serve)
;    Icon=        immagine dell'icona, centrata (PNG con trasparenza)
;    Label=       testo in basso a sinistra (lascia vuoto per non mostrarlo)
;    Color=       colore di fondo R,G,B,A usato quando manca lo sfondo
;
;  I percorsi relativi di Background e Icon partono da @Resources\Images\.
;  Si possono usare anche percorsi assoluti e variabili come #@#.
;  Dopo una modifica: tasto destro sulla skin > Aggiorna skin.
; =============================================================================

[Raintile]
Categories=Giochi|App|Link|Sistema

; --- Giochi -------------------------------------------------------------------

[Steam]
Category=Giochi
Label=Libreria Steam
Color=27,40,56,255
Command=steam://open/games

; Esempio con immagine di sfondo: copia diablo4.jpg in @Resources\Images\
; [Diablo]
; Category=Giochi
; Background=diablo4.jpg
; Command=steam://rungameid/2344520

; --- App ----------------------------------------------------------------------

[Notepad]
Category=App
Label=Blocco note
Color=40,70,110,255
Command=notepad.exe

[Calc]
Category=App
Label=Calcolatrice
Color=60,50,100,255
Command=calc.exe

[Terminal]
Category=App
Label=Terminale
Color=30,30,30,255
Command=wt.exe

[Paint]
Category=App
Label=Paint
Color=120,60,40,255
Command=mspaint.exe

; --- Link ---------------------------------------------------------------------

[GitHub]
Category=Link
Label=GitHub
Color=36,41,47,255
Command=https://github.com

[YouTube]
Category=Link
Label=YouTube
Color=150,20,20,255
Command=https://www.youtube.com

[Gmail]
Category=Link
Label=Gmail
Color=60,90,160,255
Command=https://mail.google.com

; --- Sistema ------------------------------------------------------------------

[Explorer]
Category=Sistema
Label=Esplora file
Color=150,120,30,255
Command=explorer.exe

[Settings]
Category=Sistema
Label=Impostazioni
Color=50,60,80,255
Command=ms-settings:

[RecycleBin]
Category=Sistema
Label=Cestino
Color=60,80,60,255
Command=explorer.exe shell:RecycleBinFolder

[TaskManager]
Category=Sistema
Label=Gestione attivita
Color=40,90,90,255
Command=taskmgr.exe

[ControlPanel]
Category=Sistema
Label=Pannello di controllo
Color=70,50,90,255
Command=control.exe

[Lock]
Category=Sistema
Label=Blocca PC
Color=90,40,50,255
Command=rundll32.exe user32.dll,LockWorkStation
