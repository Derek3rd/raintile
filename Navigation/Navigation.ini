; =============================================================================
;  Raintile - navigazione da tastiera
;
;  Mini-skin invisibile che registra i tasti di navigazione con il plugin
;  HotKey. Non va caricata a mano: la skin principale la attiva quando il
;  launcher viene mostrato e la disattiva quando viene nascosto, cosi' i tasti
;  (WASD, frecce, Spazio, Invio, Q, E, F) non vengono sottratti alle altre
;  applicazioni a launcher chiuso. I tasti si cambiano in Settings.inc.
; =============================================================================

[Rainmeter]
Update=-1

[Variables]
@Include=#@#Settings.inc

[MeasureKeyUp]
Measure=Plugin
Plugin=HotKey
HotKey=#NavUp#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,-1)" "#ROOTCONFIG#"]

[MeasureKeyUp2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavUp2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,-1)" "#ROOTCONFIG#"]

[MeasureKeyDown]
Measure=Plugin
Plugin=HotKey
HotKey=#NavDown#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,1)" "#ROOTCONFIG#"]

[MeasureKeyDown2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavDown2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,1)" "#ROOTCONFIG#"]

[MeasureKeyLeft]
Measure=Plugin
Plugin=HotKey
HotKey=#NavLeft#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(-1,0)" "#ROOTCONFIG#"]

[MeasureKeyLeft2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavLeft2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(-1,0)" "#ROOTCONFIG#"]

[MeasureKeyRight]
Measure=Plugin
Plugin=HotKey
HotKey=#NavRight#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(1,0)" "#ROOTCONFIG#"]

[MeasureKeyRight2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavRight2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(1,0)" "#ROOTCONFIG#"]

[MeasureKeyConfirm]
Measure=Plugin
Plugin=HotKey
HotKey=#NavConfirm#
; al rilascio: niente ripetizioni del tasto tenuto premuto, e il rilascio non
; arriva a meta' dell'animazione di avvio o all'applicazione appena aperta
KeyUpAction=[!CommandMeasure MeasureScript "Confirm()" "#ROOTCONFIG#"]
ShowAllKeys=#DebugLog#

[MeasureKeyConfirm2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavConfirm2#
; al rilascio: niente ripetizioni del tasto tenuto premuto, e il rilascio non
; arriva a meta' dell'animazione di avvio o all'applicazione appena aperta
KeyUpAction=[!CommandMeasure MeasureScript "Confirm()" "#ROOTCONFIG#"]
ShowAllKeys=#DebugLog#

[MeasureKeyPrevCategory]
Measure=Plugin
Plugin=HotKey
HotKey=#NavPrevCategory#
KeyDownAction=[!CommandMeasure MeasureScript "NextCategory(-1)" "#ROOTCONFIG#"]

[MeasureKeyNextCategory]
Measure=Plugin
Plugin=HotKey
HotKey=#NavNextCategory#
KeyDownAction=[!CommandMeasure MeasureScript "NextCategory(1)" "#ROOTCONFIG#"]

[MeasureKeySearch]
Measure=Plugin
Plugin=HotKey
HotKey=#NavSearch#
; al rilascio: la lettera non finisce nel campo di testo appena aperto
KeyUpAction=[!CommandMeasure MeasureScript "SearchOpen()" "#ROOTCONFIG#"]

; Una skin deve avere almeno un meter: un pixel trasparente
[MeterDummy]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
