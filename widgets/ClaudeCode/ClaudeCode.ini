; Claude Code: a Raintile custom widget (Widget=custom, Param=ClaudeCode).
; The Claude Code sessions open on this PC, as rows: the ones that ask you
; something first (a permission, a question), then the ones done and
; waiting for your next message, then the ones working; each with how long
; it has been so. Over them, how much of the plan's limits is used (5 hours,
; week) and when each resets. Give the tile more cells for more rows.
;
; ClaudeCode.ps1 runs only while the widget is on screen (OnShow, OnHide):
; it reads Claude Code's own list of its running sessions (read only), and
; the limits StatusLine.ps1 keeps once it is Claude Code's status line (the
; row "Usage limits: set up" opens how).

[Metadata]
Name=Claude Code
Information=The Claude Code sessions open on this PC, the ones that wait for you first, and how much of your plan's limits you used.

[Option:ShowTitle]
Label=Title
Kind=bool
Default=1
Help=A title at the top left of the tile, the rest under it.

[Option:Title]
Label=Title text
When=ShowTitle=1
Default=Claude Code
Help=What the title says.

[Option:ShowUsage]
Label=Usage limits
Kind=bool
Default=1
Help=The use of your plan's 5-hour and weekly limits, over the sessions. Needs the widget's status line in Claude Code: the tile has a row that shows how.

[Option:Folder]
Label=Claude Code folder
Default=
Help=Where Claude Code keeps its data, without a backslash at the end. Empty: CLAUDE_CONFIG_DIR, or .claude in your user folder.

; Sizes, from the tile's: CT the title's font, CY the top of the limits
; (under the title), CF their font, CL the room of one (its text and its
; bar), CB a bar's height
[Variables]
CT=(Clamp(#WIDGETH#/18,9,20))
CY=(#OPTION:ShowTitle#*(#CT#*2+12)+(1-#OPTION:ShowTitle#)*7)
CF=(Clamp(#WIDGETH#/24,8,13))
CL=(#CF#*2.9)
CB=(Max(3,#CF#*0.4))
CCmd=#WIDGETPATH#cmd_#WIDGET:Server#.ini

[Raintile]
OnShow=[!WriteKeyValue Cmd Do show "#CCmd#"][!CommandMeasure #WIDGET:Server# "Run"]
OnHide=[!WriteKeyValue Cmd Do quit "#CCmd#"]
List=list_#WIDGET:Server#.txt
ListY=(#CY#+#OPTION:ShowUsage#*(#CL#*2+4))

[Server]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#ClaudeCode.ps1" -Config "#CURRENTCONFIG#" -Section "#WIDGET:Server#" -Cmd "#CCmd#" -List "#WIDGETPATH#list_#WIDGET:Server#.txt" -Flag "#@#Generated\DashOn.txt" -Folder "#OPTION:Folder#" -ShowUsage #OPTION:ShowUsage# -Accent "#AccentColor#"
State=Hide
OutputType=UTF8

; Set by the script: the use of each limit, in %
[FivePct]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[WeekPct]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; The title, small and dimmed at the top left like the ones of the system
; widgets (Raintile writes none on a custom widget)
[Title]
Meter=String
X=12
Y=10
W=(#WIDGETW#-24)
ClipString=1
FontFace=#FontFace#
FontSize=#CT#
FontColor=#TextDimColor#
AntiAlias=1
Text=#OPTION:Title#
Hidden=(1-#OPTION:ShowTitle#)

; The limits: a line each, its name on the left, the use and when it resets
; on the right (set by the script), a bar under it
[FiveLabel]
Meter=String
X=12
Y=#CY#
FontFace=#FontFace#
FontSize=#CF#
FontColor=#TextDimColor#
AntiAlias=1
Text=5 hours
Hidden=(1-#OPTION:ShowUsage#)

[FiveValue]
Meter=String
X=(#WIDGETW#-12)
Y=#CY#
W=(Max(1,#WIDGETW#*0.7))
StringAlign=Right
ClipString=1
FontFace=#FontFace#
FontSize=#CF#
FontColor=#TextColor#
AntiAlias=1
Text=-
Hidden=(1-#OPTION:ShowUsage#)

[FiveBar]
Meter=Bar
MeasureName=FivePct
X=12
Y=(#CY#+#CF#*1.9)
W=(Max(1,#WIDGETW#-24))
H=#CB#
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=255,255,255,30
Hidden=(1-#OPTION:ShowUsage#)

[WeekLabel]
Meter=String
X=12
Y=(#CY#+#CL#)
FontFace=#FontFace#
FontSize=#CF#
FontColor=#TextDimColor#
AntiAlias=1
Text=Week
Hidden=(1-#OPTION:ShowUsage#)

[WeekValue]
Meter=String
X=(#WIDGETW#-12)
Y=(#CY#+#CL#)
W=(Max(1,#WIDGETW#*0.7))
StringAlign=Right
ClipString=1
FontFace=#FontFace#
FontSize=#CF#
FontColor=#TextColor#
AntiAlias=1
Text=-
Hidden=(1-#OPTION:ShowUsage#)

[WeekBar]
Meter=Bar
MeasureName=WeekPct
X=12
Y=(#CY#+#CL#+#CF#*1.9)
W=(Max(1,#WIDGETW#-24))
H=#CB#
BarOrientation=Horizontal
BarColor=#AccentColor#
SolidColor=255,255,255,30
Hidden=(1-#OPTION:ShowUsage#)
