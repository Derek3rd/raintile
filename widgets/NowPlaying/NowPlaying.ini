; NowPlaying: a Raintile custom widget (Widget=custom, Param=NowPlaying).
; What any player is playing (Spotify, a browser with YouTube, the Media
; Player, VLC...), as Windows shows it over the volume: its cover fills the
; tile, a bar along the bottom shows the time (a click there moves in the
; song). With the mouse over the tile (or the highlight of the keys or the
; pad on it: OnFocus) the controls show over the cover: the title, the
; artist and the player, previous, play / pause, next and the times. The
; keys and the pad go from control to control; Enter / A presses one, left
; and right on the bar move 10 seconds.
;
; NowPlaying.ps1 reads Windows' media controls (Windows 10 1809 and later),
; only while the widget is on screen (OnShow, OnHide): no plugin.

[Metadata]
Name=Now Playing
Information=What any player is playing (Spotify, YouTube in a browser...), as Windows shows it over the volume: the cover, the controls and the time.

; The cover is a square, S, the side of the tile it fits in (at its left, or
; at its top); the rest of the tile shows the title and the artist, in IF.
; Sizes, from the square's: SB the play buttons, SR their row, SF the text,
; SH the bar
[Variables]
S=(Min(#WIDGETW#,#WIDGETH#))
IF=(Clamp((#WIDGETW#>#WIDGETH# ? #WIDGETH#/7 : #WIDGETW#/14),9,28))
SB=(#S#*0.22)
SR=(#S#*0.38)
SF=(Clamp(#S#/22,8,14))
SH=(Max(3,#S#*0.018))
SCmd=#WIDGETPATH#cmd_#WIDGET:Server#.ini
SShow=[!ShowMeterGroup "#WIDGET:Cover#Ctl"][!Redraw]
SHide=[!HideMeterGroup "#WIDGET:Cover#Ctl"][!Redraw]

[Raintile]
OnShow=[!WriteKeyValue Cmd Do show "#SCmd#"][!CommandMeasure #WIDGET:Server# "Run"]
OnHide=[!WriteKeyValue Cmd Do quit "#SCmd#"]#SHide#
OnFocus=#SShow#
OnBlur=#SHide#

[Server]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#NowPlaying.ps1" -Config "#CURRENTCONFIG#" -Section "#WIDGET:Server#" -Cmd "#SCmd#" -Flag "#@#Generated\DashOn.txt"
State=Hide
OutputType=UTF8

; Set by NowPlaying.ps1: how far the song is, in %
[Progress]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Beside the cover (a wide tile) or under it (a tall one): the title and the
; artist, when there is room
[InfoTitle]
Meter=String
X=(#WIDGETW#>#WIDGETH# ? #S#+16 : 12)
Y=(#WIDGETW#>#WIDGETH# ? #WIDGETH#/2-#IF#*1.6 : #S#+8)
W=(#WIDGETW#>#WIDGETH# ? #WIDGETW#-#S#-28 : #WIDGETW#-24)
ClipString=1
FontFace=#FontFace#
FontSize=#IF#
FontWeight=700
FontColor=#TextColor#
AntiAlias=1
Hidden=(((#WIDGETW#-#S#)<80)*((#WIDGETH#-#S#)<50))

[InfoArtist]
Meter=String
X=(#WIDGETW#>#WIDGETH# ? #S#+16 : 12)
Y=(#WIDGETW#>#WIDGETH# ? #WIDGETH#/2+#IF#*0.2 : #S#+8+#IF#*1.8)
W=(#WIDGETW#>#WIDGETH# ? #WIDGETW#-#S#-28 : #WIDGETW#-24)
ClipString=1
FontFace=#FontFace#
FontSize=(#IF#*0.7)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=(((#WIDGETW#-#S#)<80)*((#WIDGETH#-#S#)<50))

; Without a cover (nothing playing, a local file): a note glyph
[NoCover]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#S#,#S# | Fill Color 255,255,255,12 | StrokeWidth 0

[NoCoverGlyph]
Meter=String
X=(#S#/2)
Y=(#S#*0.42)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#S#*0.16)
FontColor=#TextDimColor#
AntiAlias=1
Text=[\xE8D6]

[Status]
Meter=String
X=(#S#/2)
Y=(#S#*0.62)
W=(#S#-24)
StringAlign=CenterCenter
ClipString=2
FontFace=#FontFace#
FontSize=#SF#
FontColor=#TextDimColor#
AntiAlias=1
Text=Starting...

; The cover, cropped to fill the square; the mouse over it shows the controls
[Cover]
Meter=Image
X=0
Y=0
W=#S#
H=#S#
PreserveAspectRatio=2
SolidColor=0,0,0,1
MouseOverAction=#SShow#
MouseLeaveAction=#SHide#

; The controls (group <Cover>Ctl: hidden until the mouse or the keys come)
[Shade]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#S#,#S# | Fill Color 0,0,0,170 | StrokeWidth 0
Group=#WIDGET:Cover#Ctl
Hidden=1

[Title]
Meter=String
X=10
Y=8
W=(#S#-20)
ClipString=1
FontFace=#FontFace#
FontSize=#SF#
FontWeight=700
FontColor=#TextColor#
AntiAlias=1
Group=#WIDGET:Cover#Ctl
Hidden=1

[Artist]
Meter=String
X=10
Y=(8+#SF#*1.7)
W=(#S#-20)
ClipString=1
FontFace=#FontFace#
FontSize=(#SF#*0.85)
FontColor=#TextDimColor#
AntiAlias=1
Group=#WIDGET:Cover#Ctl
Hidden=1

; The player (Spotify, Chrome...)
[App]
Meter=String
X=10
Y=(8+#SF#*3.2)
W=(#S#-20)
ClipString=1
FontFace=#FontFace#
FontSize=(#SF#*0.75)
FontColor=#TextDimColor#
AntiAlias=1
Group=#WIDGET:Cover#Ctl
Hidden=1

; Each button: a part (where the highlight goes, and the click) and its glyph
; (Segoe MDL2 Assets) over it
[Previous]
Meter=Shape
X=(#S#/2-#SB#*1.6)
Y=#SR#
Shape=Rectangle 0,0,#SB#,#SB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do previous "#SCmd#"]
Group=#WIDGET:Cover#Ctl
Hidden=1

[PreviousGlyph]
Meter=String
X=(#S#/2-#SB#*1.1)
Y=(#SR#+#SB#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SB#*0.4)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE892]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Play]
Meter=Shape
X=(#S#/2-#SB#/2)
Y=#SR#
Shape=Rectangle 0,0,#SB#,#SB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do playpause "#SCmd#"]
Group=#WIDGET:Cover#Ctl
Hidden=1

[PlayGlyph]
Meter=String
X=(#S#/2)
Y=(#SR#+#SB#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SB#*0.5)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE768]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Next]
Meter=Shape
X=(#S#/2+#SB#*0.6)
Y=#SR#
Shape=Rectangle 0,0,#SB#,#SB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do next "#SCmd#"]
Group=#WIDGET:Cover#Ctl
Hidden=1

[NextGlyph]
Meter=String
X=(#S#/2+#SB#*1.1)
Y=(#SR#+#SB#/2)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#SB#*0.4)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE893]
Group=#WIDGET:Cover#Ctl
Hidden=1

[Pos]
Meter=String
X=10
Y=(#S#*0.81)
StringAlign=LeftCenter
FontFace=#FontFace#
FontSize=#SF#
FontColor=#TextColor#
AntiAlias=1
Text=0:00
Group=#WIDGET:Cover#Ctl
Hidden=1

[Dur]
Meter=String
X=(#S#-10)
Y=(#S#*0.81)
StringAlign=RightCenter
FontFace=#FontFace#
FontSize=#SF#
FontColor=#TextColor#
AntiAlias=1
Text=0:00
Group=#WIDGET:Cover#Ctl
Hidden=1

; The time: a bar along the bottom, always; over it, a strip where a click
; moves in the song (a part: left and right move 10 seconds)
[BarBack]
Meter=Shape
X=0
Y=(#S#-#SH#)
Shape=Rectangle 0,0,#S#,#SH# | Fill Color 255,255,255,40 | StrokeWidth 0

[Bar]
Meter=Bar
MeasureName=Progress
X=0
Y=(#S#-#SH#)
W=#S#
H=#SH#
BarOrientation=Horizontal
BarColor=#AccentColor#

[Seek]
Meter=Shape
X=0
Y=(#S#*0.92)
Shape=Rectangle 0,0,#S#,(#S#*0.08) | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do "seek $MouseX:%$" "#SCmd#"]
KeyLeftAction=[!WriteKeyValue Cmd Do "step -10" "#SCmd#"]
KeyRightAction=[!WriteKeyValue Cmd Do "step 10" "#SCmd#"]
MouseOverAction=#SShow#
