; SteamAchievements: a Raintile custom widget (Widget=custom,
; Param=SteamAchievements). The achievements of a Steam game: the game with
; how many are unlocked, the last ones unlocked, then the locked ones most
; players have (the next easy ones). A click opens the game's achievements.
;
; The game: WidgetOption=<Steam app id> on the tile (e.g. 570), or none for
; the game played last. Needs your Steam Web API key: Options > Widgets >
; Steam achievements (its ApiKey, saved in settings.inc here). Give the tile more cells for more rows (Size=1x2).
;
; When its category comes on screen, OnShow runs SteamAchievements.ps1, which
; asks the Steam Web API (at most every 5 minutes for the same game) and
; writes the rows to list_<option>.txt, then calls WidgetChanged().

[Metadata]
Name=Steam achievements
Information=The achievements of a Steam game: the last unlocked, the next easy ones.

[Option:ApiKey]
Label=Steam Web API key
Kind=secret
Help=Free, from steamcommunity.com/dev/apikey (any domain name). Your profile's game details must be public.

[Raintile]
OnShow=[!CommandMeasure #WIDGET:Read# "Run"]
List=list_#WIDGETOPTION#.txt
ListY=(Clamp(#WIDGETH#/18,9,20)*2+12)

[Read]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#SteamAchievements.ps1" -Out "#WIDGETPATH#list_#WIDGETOPTION#.txt" -Game "#WIDGETOPTION#" -Settings "#WIDGETPATH#settings.inc"
State=Hide
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureScript "WidgetChanged()"]

; The title, small and dimmed at the top left like the ones of the system
; widgets (Raintile writes none on a custom widget); the rows start under it
; (ListY= above, the same size: the title's font and two lines of it)
[Title]
Meter=String
X=12
Y=10
W=(#WIDGETW#-24)
ClipString=1
FontFace=#FontFace#
FontSize=(Clamp(#WIDGETH#/18,9,20))
FontColor=#TextDimColor#
AntiAlias=1
Text=Steam achievements
