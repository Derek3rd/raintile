; =============================================================================
;  Un file per categoria: il nome del file (senza .ini) identifica la categoria
;  e la cartella delle sue immagini, @Resources\Images\<file>\.
;
;  [Category]       voce del menu (facoltativa)
;    Name=          testo mostrato (se vuoto: il nome del file)
;    Icon=          icona; se vuoto cerca Images\<file>\icon.png|jpg
;    Order=         posizione nel menu (numero); a parita', ordine alfabetico
;
;  Ogni altra sezione e' una tile, nell'ordine del file. Le immagini vengono
;  cercate da sole, usando come nome quello della sezione:
;    Images\<file>\background\<NomeTile>.png|jpg|jpeg|bmp   sfondo
;    Images\<file>\logo\<NomeTile>.png|jpg|jpeg|bmp         logo centrato
;  Quindi, con le due immagini al loro posto, basta:
;    [Diablo]
;    Command=steam://rungameid/2344520
;
;  Chiavi facoltative della tile:
;    Command=       programma, collegamento .lnk/.url, URL, cartella, o bang
;    Image=         altro nome per entrambe le immagini (es. Image=diablo4
;                   cerca background\diablo4.* e logo\diablo4.*)
;    Background=    file di sfondo specifico (relativo a background\ o
;                   percorso assoluto; l'estensione si puo' omettere)
;    Logo=          file di logo specifico (relativo a logo\ o assoluto)
;    Label=         testo in basso a sinistra; se la tile non ha immagini
;                   viene mostrato il nome della sezione
;    Color=         colore di fondo R,G,B,A quando manca lo sfondo
;
;  Dopo una modifica: tasto destro sulla skin > Aggiorna skin.
; =============================================================================

[Category]
Name=Giochi
Order=1

[Steam]
Label=Libreria Steam
Color=27,40,56,255
Command=steam://open/games

; Esempio: con Images\Games\background\Diablo.jpg e Images\Games\logo\Diablo.png
; [Diablo]
; Command=steam://rungameid/2344520
