; =============================================================================
;  Raintile - launcher a tile per Rainmeter
;
;  Le impostazioni si modificano in  @Resources\Settings.inc
;  Le tile e le categorie si modificano in  @Resources\Tiles.ini
;
;  Il file @Resources\Generated\Grid.inc viene rigenerato automaticamente dallo
;  script quando cambiano NX, NY o l'elenco delle categorie: non modificarlo.
; =============================================================================

[Rainmeter]
; Nessun ciclo di aggiornamento: la skin ridisegna solo in risposta a eventi
; (click, scroll, hover). A riposo il consumo di CPU e' nullo.
Update=-1
AccurateText=1
DynamicWindowSize=0
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
MouseScrollLeftAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollRightAction=[!CommandMeasure MeasureScript "Scroll(1)"]
ContextTitle=Modifica tile
ContextAction=["#@#Tiles.ini"]
ContextTitle2=Impostazioni
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Cartella immagini
ContextAction3=["#@#Images"]

[Metadata]
Name=Raintile
Information=Launcher a griglia di tile divise per categorie, pensato per sostituire le icone del desktop.
Version=0.1.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeState=#@#State.inc

; -----------------------------------------------------------------------------
;  Stili
; -----------------------------------------------------------------------------

[StyleCategory]
FontFace=#FontFace#
FontSize=#MenuFontSize#
FontWeight=600
FontColor=#TextDimColor#
SolidColor=0,0,0,1
Padding=14,6,14,6
StringAlign=LeftCenter
AntiAlias=1
Group=Menu

[StyleTile]
W=#TileW#
H=#TileH#
PreserveAspectRatio=2
SolidColor=#TileColor#
Group=Tiles
Hidden=1

[StyleTileIcon]
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
Group=Tiles
Hidden=1

[StyleTileLabel]
W=(#TileW#-2*#LabelPad#)
ClipString=1
FontFace=#FontFace#
FontSize=#LabelFontSize#
FontWeight=600
FontColor=#TextColor#
FontEffect=Shadow
FontEffectColor=0,0,0,200
StringAlign=LeftBottom
AntiAlias=1
Group=Tiles
Hidden=1

[StyleTileHover]
Shape=Rectangle 1,1,(#TileW#-2),(#TileH#-2) | Fill Color #HoverColor# | StrokeWidth 2 | Stroke Color #AccentColor#
Hidden=1

; -----------------------------------------------------------------------------
;  Script (aggiornato una sola volta al caricamento, poi solo via !CommandMeasure)
; -----------------------------------------------------------------------------

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Raintile.lua
UpdateDivider=-1

; -----------------------------------------------------------------------------
;  Meter
; -----------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,(#PadX#*2+#NX#*#TileW#+(#NX#-1)*#Gap#),(#PadY#*2+#MenuH#+#Gap#+#NY#*#TileH#+(#NY#-1)*#Gap#),#Radius# | Fill Color #BgColor# | StrokeWidth 0

; Menu delle categorie e griglia di tile (generati dallo script)
[GridInclude]
@IncludeGrid=#@#Generated\Grid.inc

[MeterScrollBar]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Tiles
Hidden=1
