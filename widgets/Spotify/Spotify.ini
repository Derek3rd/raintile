; Spotify: a Raintile custom widget (Widget=custom, Param=Spotify).
; The song playing in Spotify, as Spotify's own player: the cover, a square
; centred at the top (a click opens Spotify), under it the controls, always
; there (shuffle, previous, play / pause, next, repeat, and the heart of
; Liked Songs on the right), then the time: where the song is, a bar (a
; click there moves in the song) and its length. The keys and the pad go
; from control to control; Enter / A presses one, left and right on the bar
; move 10 seconds.
;
; Needs Spicetify with its WebNowPlaying extension: from Spotify it connects
; to the widget's script, Spotify.ps1, a small WebSocket server on this PC
; only (127.0.0.1, the Port setting), running only while the widget is on
; screen (OnShow, OnHide). Another WebNowPlaying (a skin with its plugin)
; must not run at the same time: they would share the port.

[Metadata]
Name=Spotify
Information=The song playing in Spotify with its cover, the controls and the time. Needs Spicetify with its WebNowPlaying extension (and no other WebNowPlaying skin loaded).

[Option:ShowTrack]
Label=Title and artist
Kind=bool
Default=1
Help=Over the cover, the song and who plays it.

[Option:Port]
Label=Port
Kind=number
Default=8974
Help=Where Spicetify's WebNowPlaying extension connects: 8974 unless you changed it there.

; Sizes, from the tile's: PN the title's font, PA the room of the title
; and the artist over the cover (none without them: the ShowTrack setting),
; PF the room under the cover, PS the cover (a square: as wide as the tile
; allows and as high as the room between PA and PF), PB a
; button, PC the middle of their row, PR the row of the time, PT the middle
; of that row, PTF its text, PTW the room of a time, PH the bar. Every size
; has a floor and a height: a meter out of the tile would make the
; launcher's window larger.
[Variables]
PN=(Clamp(#WIDGETH#/26,8,14))
PA=(#OPTION:ShowTrack#*(#PN#*3.4+4))
PF=(Clamp(#WIDGETH#*0.3,56,160))
PS=(Max(1,Min(#WIDGETW#-16,#WIDGETH#-#PF#-10-#PA#)))
PB=(Max(12,Min(#PF#*0.5,#WIDGETW#/9.5)))
PC=(8+#PA#+#PS#+#PB#*0.62)
PR=(Max(12,#PF#*0.32))
PT=(8+#PA#+#PS#+#PB#*1.2+#PR#*0.5)
PTF=(Clamp(#PR#*0.42,7,12))
PTW=(#PTF#*3.8)
PH=(Max(3,#PR#*0.16))
PCmd=#WIDGETPATH#cmd_#WIDGET:Server#.ini

[Raintile]
OnShow=[!WriteKeyValue Cmd Do show "#PCmd#"][!CommandMeasure #WIDGET:Server# "Run"]
OnHide=[!WriteKeyValue Cmd Do quit "#PCmd#"]

[Server]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#Spotify.ps1" -Config "#CURRENTCONFIG#" -Section "#WIDGET:Server#" -Cmd "#PCmd#" -Port "#OPTION:Port#" -Flag "#@#Generated\DashOn.txt" -Text "#TextColor#" -Accent "#AccentColor#"
State=Hide
OutputType=UTF8

; Set by the script: how far the song is, in %
[Progress]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; Without a cover (nothing playing, a local file): a note glyph
[NoCover]
Meter=Shape
X=((#WIDGETW#-#PS#)/2)
Y=(8+#PA#)
Shape=Rectangle 0,0,#PS#,#PS#,6 | Fill Color 255,255,255,12 | StrokeWidth 0

[NoCoverGlyph]
Meter=String
X=(#WIDGETW#/2)
Y=(8+#PA#+#PS#*0.4)
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(Max(6,#PS#*0.16))
FontColor=#TextDimColor#
AntiAlias=1
Text=[\xE8D6]

[Status]
Meter=String
X=(#WIDGETW#/2)
Y=(8+#PA#+#PS#*0.72)
W=(Max(1,#PS#-16))
H=(#PTF#*4.5)
StringAlign=CenterCenter
ClipString=2
FontFace=#FontFace#
FontSize=#PTF#
FontColor=#TextDimColor#
AntiAlias=1
Text=Starting...

; The title and the artist over the cover (ShowTrack), from its left edge
[Title]
Meter=String
X=((#WIDGETW#-#PS#)/2)
Y=6
W=(Max(1,(#WIDGETW#+#PS#)/2-8))
H=(#PN#*1.8)
StringAlign=LeftTop
ClipString=1
FontFace=#FontFace#
FontSize=#PN#
FontWeight=700
FontColor=#TextColor#
AntiAlias=1
Hidden=(1-#OPTION:ShowTrack#)

[Artist]
Meter=String
X=((#WIDGETW#-#PS#)/2)
Y=(6+#PN#*1.75)
W=(Max(1,(#WIDGETW#+#PS#)/2-8))
H=(#PN#*1.6)
StringAlign=LeftTop
ClipString=1
FontFace=#FontFace#
FontSize=(#PN#*0.85)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=(1-#OPTION:ShowTrack#)

; The cover, cropped to a square
[Cover]
Meter=Image
X=((#WIDGETW#-#PS#)/2)
Y=(8+#PA#)
W=#PS#
H=#PS#
PreserveAspectRatio=2
SolidColor=0,0,0,1
Part=1
LeftMouseUpAction=["spotify:"]
ToolTipText=Open Spotify

; The controls, always there: each a part (where the highlight goes, and the
; click) and its glyph over it (Segoe MDL2 Assets)
[Shuffle]
Meter=Shape
X=((#WIDGETW#/2-#PB#*2.3)-#PB#/2)
Y=(#PC#-#PB#/2)
Shape=Rectangle 0,0,#PB#,#PB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do shuffle "#PCmd#"]
ToolTipText=Shuffle

[ShuffleGlyph]
Meter=String
X=(#WIDGETW#/2-#PB#*2.3)
Y=#PC#
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#PB#*0.3)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE8B1]

[Previous]
Meter=Shape
X=((#WIDGETW#/2-#PB#*1.15)-#PB#/2)
Y=(#PC#-#PB#/2)
Shape=Rectangle 0,0,#PB#,#PB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do previous "#PCmd#"]
ToolTipText=Previous

[PreviousGlyph]
Meter=String
X=(#WIDGETW#/2-#PB#*1.15)
Y=#PC#
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#PB#*0.3)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE892]

[Play]
Meter=Shape
X=((#WIDGETW#/2)-#PB#/2)
Y=(#PC#-#PB#/2)
Shape=Rectangle 0,0,#PB#,#PB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Ellipse (#PB#/2),(#PB#/2),(#PB#*0.42) | Fill Color 255,255,255,255 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do playpause "#PCmd#"]
ToolTipText=Play / pause

[PlayGlyph]
Meter=String
X=(#WIDGETW#/2)
Y=#PC#
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#PB#*0.32)
FontColor=0,0,0,255
AntiAlias=1
Text=[\xE768]

[Next]
Meter=Shape
X=((#WIDGETW#/2+#PB#*1.15)-#PB#/2)
Y=(#PC#-#PB#/2)
Shape=Rectangle 0,0,#PB#,#PB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do next "#PCmd#"]
ToolTipText=Next

[NextGlyph]
Meter=String
X=(#WIDGETW#/2+#PB#*1.15)
Y=#PC#
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#PB#*0.3)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE893]

[Repeat]
Meter=Shape
X=((#WIDGETW#/2+#PB#*2.3)-#PB#/2)
Y=(#PC#-#PB#/2)
Shape=Rectangle 0,0,#PB#,#PB#,6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do repeat "#PCmd#"]
ToolTipText=Repeat

[RepeatGlyph]
Meter=String
X=(#WIDGETW#/2+#PB#*2.3)
Y=#PC#
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=(#PB#*0.3)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE8EE]

; The heart of Liked Songs, on the right, over the song's length
[Like]
Meter=Shape
X=((#WIDGETW#-8-#PB#*0.4)-(#PB#*0.8)/2)
Y=(#PC#-(#PB#*0.8)/2)
Shape=Rectangle 0,0,(#PB#*0.8),(#PB#*0.8),6 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do like "#PCmd#"]
ToolTipText=Liked Songs

[LikeGlyph]
Meter=String
X=(#WIDGETW#-8-#PB#*0.4)
Y=#PC#
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=((#PB#*0.8)*0.3)
FontColor=#TextColor#
AntiAlias=1
Text=[\xE006]

; The time: where the song is, the bar, its length; over the bar a strip
; where a click moves in the song (a part: left and right move 10 seconds)
[Pos]
Meter=String
X=8
Y=#PT#
W=#PTW#
H=(#PTF#*1.8)
StringAlign=LeftCenter
ClipString=1
FontFace=#FontFace#
FontSize=#PTF#
FontColor=#TextDimColor#
AntiAlias=1
Text=0:00

[Dur]
Meter=String
X=(#WIDGETW#-8)
Y=#PT#
W=#PTW#
H=(#PTF#*1.8)
StringAlign=RightCenter
ClipString=1
FontFace=#FontFace#
FontSize=#PTF#
FontColor=#TextDimColor#
AntiAlias=1
Text=0:00

[BarBack]
Meter=Shape
X=(8+#PTW#)
Y=(#PT#-#PH#/2)
Shape=Rectangle 0,0,(Max(1,#WIDGETW#-16-#PTW#*2)),#PH#,(#PH#/2) | Fill Color 255,255,255,50 | StrokeWidth 0

[Bar]
Meter=Bar
MeasureName=Progress
X=(8+#PTW#)
Y=(#PT#-#PH#/2)
W=(Max(1,#WIDGETW#-16-#PTW#*2))
H=#PH#
BarOrientation=Horizontal
BarColor=#TextColor#

[Seek]
Meter=Shape
X=(8+#PTW#)
Y=(#PT#-#PR#/2)
Shape=Rectangle 0,0,(Max(1,#WIDGETW#-16-#PTW#*2)),#PR# | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do "seek $MouseX:%$" "#PCmd#"]
KeyLeftAction=[!WriteKeyValue Cmd Do "step -10" "#PCmd#"]
KeyRightAction=[!WriteKeyValue Cmd Do "step 10" "#PCmd#"]
