; =============================================================================
;  Raintile - tile launcher for Rainmeter
;
;  Your settings, categories and images are in  %APPDATA%\Rainmeter\Raintile\
;  (#SETTINGSPATH#Raintile\): installing an update never touches them. The
;  files in @Resources\ (Settings.inc, Categories\, Images\) are the defaults
;  copied there the first time. Settings are best edited from the Options window.
;
;  @Resources\Generated\Grid.inc is regenerated automatically by the script
;  when the grids or the list of categories change: do not edit it.
; =============================================================================

[Rainmeter]
; No update cycle: the skin only redraws in response to events (click,
; scroll, hover). At rest it uses no CPU.
Update=-1
AccurateText=1
DynamicWindowSize=0
; Moves the skin to the screen corner and re-centres the menu once drawn, then,
; in the background, checks the files in Categories\ again and creates missing
; thumbnails
OnRefreshAction=[!CommandMeasure MeasureScript "Setup()"][!Move "#ScreenX#" "#ScreenY#"][!CommandMeasure MeasureScript "Layout()"][!CommandMeasure MeasureCategoryList "Run"][!CommandMeasure MeasureScript "BuildThumbnails()"][!CommandMeasure MeasureScript "AutoScan()"][!CommandMeasure MeasureScript "AutoUpdateCheck()"][!CommandMeasure MeasureHelper "Run"]
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
MouseScrollLeftAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollRightAction=[!CommandMeasure MeasureScript "Scroll(1)"]
; A right press outside the tiles: "Edit this tile" has no tile (the tiles
; have their own action, which wins)
RightMouseDownAction=[!CommandMeasure MeasureScript "PointTile(0)"]
ContextTitle=Options...
ContextAction=#OptionsAction#
ContextTitle2=Edit this tile...
ContextAction2=[!CommandMeasure MeasureScript "EditTile()"]
ContextTitle6=Categories folder
ContextAction6=["#SETTINGSPATH#Raintile\Categories"]
ContextTitle3=Edit Settings.inc
ContextAction3=["#SETTINGSPATH#Raintile\Settings.inc"]
ContextTitle4=Images folder
ContextAction4=["#SETTINGSPATH#Raintile\Images"]
ContextTitle5=Add games and apps...
ContextAction5=#OptionsImportAction#

[Metadata]
Name=Raintile
Information=Full-screen tile launcher organised in categories, meant to replace desktop icons.
Version=1.0.2

[Variables]
; Defaults, then your settings and positions (they take precedence)
@IncludeSettings=#@#Settings.inc
@IncludeUserSettings=#SETTINGSPATH#Raintile\Settings.inc
@IncludeState=#@#State.inc
@IncludeUserState=#SETTINGSPATH#Raintile\State.inc
; Percentage sizes from Settings.inc converted to pixels by the script
@IncludeSizes=#@#Generated\Sizes.inc
; Default tile size (the script recomputes it for each category)
TileW=(Floor((#ScreenW#-2*#PadX#-(#NX#-1)*#Gap#)/#NX#))
TileH=(Floor((#ScreenH#-2*#PadY#-#MenuH#-#Gap#-(#NY#-1)*#Gap#)/#NY#))
; Opens the Options window (hiding the full-screen launcher first).
; conhost --headless starts PowerShell without any console window (with
; Windows Terminal as the default terminal, -WindowStyle Hidden would leave an
; empty window); RunCommand is not used because it would close the window on
; every skin refresh. "#@#." keeps the trailing backslash from escaping the
; closing quote.
OptionsAction=[!CommandMeasure MeasureScript "Hide()"]["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File "#@#Scripts\Options.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile" -Config "#ROOTCONFIG#"]
; The same, opened on the list of games and apps found
OptionsImportAction=[!CommandMeasure MeasureScript "Hide()"]["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File "#@#Scripts\Options.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile" -Config "#ROOTCONFIG#" -Page import]
; The same, opened on the tile written to Generated\EditTile.txt (context
; menu > Edit this tile)
OptionsTileAction=[!CommandMeasure MeasureScript "Hide()"]["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File "#@#Scripts\Options.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile" -Config "#ROOTCONFIG#" -Page tile]
; The same, opened on Info (where updates are shown)
OptionsInfoAction=[!CommandMeasure MeasureScript "Hide()"]["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File "#@#Scripts\Options.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile" -Config "#ROOTCONFIG#" -Page info]

; -----------------------------------------------------------------------------
;  Styles
; -----------------------------------------------------------------------------

[StyleCategory]
FontFace=#FontFace#
FontSize=#MenuFontSize#
FontWeight=600
FontColor=#TextDimColor#
StringAlign=LeftCenter
AntiAlias=1
Group=Menu

[StyleCategoryIcon]
W=#MenuIconSize#
H=#MenuIconSize#
PreserveAspectRatio=1
ImageAlpha=#MenuIconDimAlpha#
Group=Menu

[StyleCategoryHit]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Menu
Hidden=1

[StyleCategoryPill]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Menu
Hidden=1

[StyleTile]
Container=GridClip
W=#TileW#
H=#TileH#
PreserveAspectRatio=2
SolidColor=#TileColor#
Group=Tiles
Hidden=1

[StyleTileIcon]
Container=GridClip
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
Group=Tiles
Hidden=1

[StyleTileLabel]
Container=GridClip
W=(#TileW#-2*#LabelPad#)
ClipString=1
FontFace=#FontFace#
FontSize=#LabelFontSize#
FontWeight=600
FontColor=#TextColor#
FontEffect=Shadow
FontEffectColor=0,0,0,200
StringAlign=LeftBottom
AntiAlias=1
Group=Tiles
Hidden=1

[StyleTileHover]
Shape=Rectangle 1,1,(#TileW#-2),(#TileH#-2) | Fill Color #HoverColor# | StrokeWidth 2 | Stroke Color #AccentColor#
Hidden=1

; -----------------------------------------------------------------------------
;  Script (updated only once on load, then only through !CommandMeasure)
; -----------------------------------------------------------------------------

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Raintile.lua
UpdateDivider=-1

; List of category files, read in the background on every load (the script
; points it at the data folder)
[MeasureCategoryList]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c dir /b /a-d "#SETTINGSPATH#Raintile\Categories\*.ini"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureCategoryList][!CommandMeasure MeasureScript "OnCategoryList()"]

; Background and logo thumbnails, created in the background only when missing
[MeasureThumbs]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Thumbs.ps1" "#@#Generated\Thumbs.txt"
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureScript "OnThumbnails()"]

; Prepares the data folder (first run, or settings added by an update), see
; Data.ps1; the script refreshes the skin when it is done
[MeasureSetup]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Data.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile" -Skins "#SKINSPATH#." -Config "#ROOTCONFIG#"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureSetup][!CommandMeasure MeasureScript "OnSetup()"]

; Update check (CheckUpdates=1): the latest release on GitHub, at most once a
; day (see Update.ps1)
[MeasureUpdate]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Update.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureUpdate][!CommandMeasure MeasureScript "OnUpdateCheck()"]

; Background search of the installed games and apps (ScanOnStart=1): nothing
; is added, new ones only light the dot on the gear (see Scan.ps1). "#@#."
; keeps the trailing backslash from escaping the closing quote.
[MeasureScan]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Scan.ps1" -Resources "#@#." -Data "#SETTINGSPATH#Raintile" -Stores "#ImportStores#"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureScan][!CommandMeasure MeasureScript "OnScan()"]

; Search text field, over the bar at the top left (InputText plugin). Lua long
; brackets [==[...]==] and triple quotes allow searching for text with
; apostrophes or quotes too.
[MeasureSearchInput]
Measure=Plugin
Plugin=InputText
X=(#PadX#+40)
Y=(#PadY#+(#MenuH#-#MenuFontSize#*2)/2)
W=(#SearchW#-56)
H=(#MenuFontSize#*2)
SolidColor=24,24,30,255
FontColor=#TextColor#
FontFace=#FontFace#
FontSize=#MenuFontSize#
FocusDismiss=1
DynamicVariables=1
UpdateDivider=-1
Command1=[!CommandMeasure MeasureScript """SearchSubmit([==[$UserInput$]==])"""]
OnDismissAction=[!CommandMeasure MeasureScript "SearchDismiss()"]

; Turns the navigation keys back on shortly after the search, so the release
; of Enter (which confirmed the text) does not launch the first result
[MeasureKeysDelay]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 300 | Ready
Ready=[!CommandMeasure MeasureScript "KeysReady()"]
UpdateDivider=-1

; Background helper (Helper.ps1): gamepad (XInput) and hide on focus loss.
; One copy at a time; with Gamepad=0 and AutoHide=0 it only closes the copy
; that may be running.
[MeasureHelper]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Helper.ps1" -Gamepad #Gamepad# -AutoHide #AutoHide# -Config "#ROOTCONFIG#" -Toggle "#GamepadToggle#" -DeadZone #GamepadDeadZone# -RepeatDelay #GamepadRepeatDelay# -RepeatRate #GamepadRepeatRate#
State=Hide
UpdateDivider=-1

; Launch animation: tile expansion, wait, close (ActionTimer plugin)
[MeasureLaunchAnim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Step, 16, #LaunchAnimFrames# | Wait #LaunchHold# | Finish
Step=[!CommandMeasure MeasureScript "LaunchStep()"]
Finish=[!CommandMeasure MeasureScript "LaunchFinish()"]
UpdateDivider=-1

; Animation clock (open, category, hover, scroll, Pan): each step schedules
; the next one only after drawing (the two lists alternate), so steps never
; queue up; it only runs while something moves
[MeasureAnim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 16 | Tick1
ActionList2=Wait 16 | Tick2
Tick1=[!CommandMeasure MeasureScript "Tick(1)"]
Tick2=[!CommandMeasure MeasureScript "Tick(2)"]
UpdateDivider=-1

; Key combination that opens and closes the launcher (HotKey plugin). It stays
; active while the launcher is hidden: the skin is always loaded.
[MeasureOpenKey]
Measure=Plugin
Plugin=HotKey
HotKey=#OpenHotKey#
KeyDownAction=[!CommandMeasure MeasureScript "Toggle()"]

; -----------------------------------------------------------------------------
;  Meter
; -----------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#ScreenW#,#ScreenH# | Fill Color #BgColor# | StrokeWidth 0

; Highlight of the active category and of the one under the mouse
[CatPillHover]
Meter=Shape
MeterStyle=StyleCategoryPill

[CatPillActive]
Meter=Shape
MeterStyle=StyleCategoryPill

; Grid area: a container (Rainmeter 4.5+) that clips the tiles going past its
; edges while scrolling. Tiles use coordinates relative to it.
[GridClip]
Meter=Shape
X=#PadX#
Y=(#PadY#+#MenuH#+#Gap#)
Shape=Rectangle 0,0,(#ScreenW#-2*#PadX#),(#ScreenH#-2*#PadY#-#MenuH#-#Gap#) | Fill Color 0,0,0,255 | StrokeWidth 0

; Category menu and tile grid (generated by the script)
[GridInclude]
@IncludeGrid=#@#Generated\Grid.inc

; Highlight of the tile under the mouse (moved by the script)
[TileHover]
Meter=Shape
MeterStyle=StyleTileHover
Container=GridClip
Group=Tiles

; Search bar at the top left: magnifier (Segoe MDL2 Assets) + text
[SearchPill]
Meter=Shape
X=#PadX#
Y=#PadY#
Shape=Rectangle 0,0,#SearchW#,#MenuH#,(#MenuH#/2) | Fill Color #HoverCategoryColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureScript "SearchOpen()"]
Group=Menu

[SearchText]
Meter=String
X=(#PadX#+16)
Y=(#PadY#+#MenuH#/2)
StringAlign=LeftCenter
W=(#SearchW#-32)
ClipString=1
Text=#SearchPlaceholder#
InlineSetting=Face | Segoe MDL2 Assets
InlinePattern=^(.)
Prefix="[\xE721]   "
FontFace=#FontFace#
FontSize=#MenuFontSize#
FontColor=#TextDimColor#
AntiAlias=1
Group=Menu

; Message when the search finds nothing
[SearchEmpty]
Meter=String
X=(#ScreenW#/2)
Y=(#ScreenH#/2)
StringAlign=CenterCenter
Text=No results
FontFace=#FontFace#
FontSize=(#MenuFontSize#*2)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=1

; Options button, left of the X ("Settings" glyph)
[MeterOptions]
Meter=String
X=(#ScreenW#-#PadX#-#CloseSize#*3)
Y=(#PadY#+#MenuH#/2)
StringAlign=RightCenter
Text=[\xE713]
FontFace=Segoe MDL2 Assets
FontSize=#CloseSize#
FontColor=#TextDimColor#
SolidColor=0,0,0,1
Padding=10,10,10,10
AntiAlias=1
LeftMouseUpAction=#OptionsAction#
MouseOverAction=[!SetOption MeterOptions FontColor "#AccentColor#"][!UpdateMeter MeterOptions][!Redraw]
MouseLeaveAction=[!SetOption MeterOptions FontColor "#TextDimColor#"][!UpdateMeter MeterOptions][!Redraw]

; Dot on the gear: an update is available, or new games or apps were found
; (shown by the script). A click opens the Options window on Info or Import.
[MeterNotice]
Meter=Shape
X=(#ScreenW#-#PadX#-#CloseSize#*3+2)
Y=(#PadY#+#MenuH#/2-#CloseSize#+2)
Shape=Ellipse 5,5,5 | Fill Color #AccentColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureScript "OpenNotice()"]
Hidden=1

; Close button at the top right (Segoe MDL2 Assets "Cancel" glyph)
[MeterClose]
Meter=String
X=(#ScreenW#-#PadX#)
Y=(#PadY#+#MenuH#/2)
StringAlign=RightCenter
Text=[\xE711]
FontFace=Segoe MDL2 Assets
FontSize=#CloseSize#
FontColor=#TextDimColor#
SolidColor=0,0,0,1
Padding=10,10,10,10
AntiAlias=1
LeftMouseUpAction=#CloseAction#
MouseOverAction=[!SetOption MeterClose FontColor "#AccentColor#"][!UpdateMeter MeterClose][!Redraw]
MouseLeaveAction=[!SetOption MeterClose FontColor "#TextDimColor#"][!UpdateMeter MeterClose][!Redraw]

[MeterScrollBar]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Tiles
Hidden=1

; Tile expanded during launch (above everything, placed by the script)
[SplashBg]
Meter=Image
PreserveAspectRatio=2
Group=Splash
Hidden=1

[SplashLogo]
Meter=Image
PreserveAspectRatio=1
Group=Splash
Hidden=1

[SplashLabel]
Meter=String
StringAlign=CenterCenter
FontFace=#FontFace#
FontSize=#LaunchFontSize#
FontWeight=700
FontColor=#TextColor#
FontEffect=Shadow
FontEffectColor=0,0,0,200
AntiAlias=1
Group=Splash
Hidden=1
