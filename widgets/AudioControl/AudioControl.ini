DynamicVariables=1
Hidden=((([Count]<1)+((#ATop#+1*#ARowH#)>(#WIDGETH#-4)))>0)

[Minus1]
Meter=Shape
X=#AP#
Y=((#ATop#+0*#ARowH#)+#ANameH#)
Shape=Rectangle 0,0,#AS#,#AS#,4 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (#AS#*0.28),(#AS#/2),(#AS#*0.72),(#AS#/2) | StrokeWidth 1.5 | Stroke Color #TextColor#
LeftMouseUpAction=[!WriteKeyValue Cmd Do "down 1" "#ACmd#"]
MouseScrollUpAction=[!WriteKeyValue Cmd Do "up 1" "#ACmd#"]
MouseScrollDownAction=[!WriteKeyValue Cmd Do "down 1" "#ACmd#"]
MiddleMouseUpAction=[!WriteKeyValue Cmd Do "mute 1" "#ACmd#"]
DynamicVariables=1
