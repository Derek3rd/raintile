# Builds the Options program (src/Options, RaintileOptions.exe) and the
# .rmskin package with it (tools/build_rmskin.py), and attaches the package to
# the release when a release is published. On a pull request, or run by hand
# (Actions > Release package > Run workflow), it only builds them, as a
# downloadable artifact to test. The "checks" job runs the checks and tests
# (tools/check.py) on every pull request.
#
# The release tag should be the version, e.g. v1.0.3, the same as Version= in
# Raintile.ini: if they differ the build stops, before attaching anything.

name: Release package

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # tools/check.py: checks on the files and the tests (tests/ps, tests/lua).
  # On Windows, with Windows PowerShell 5.1 like the skin; lupa gives Lua 5.1,
  # the version of Rainmeter. The whole history, for the GRID_VERSION check
  # against the PR's base.
  checks:
    if: github.event_name != 'release'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua 5.1 (lupa)
        run: python -m pip install "lupa>=2,<3"

      - name: Checks and tests
        run: python tools/check.py

  package:
    # the pre-release "nightly" has its own workflow (nightly.yml)
    if: github.event_name != 'release' || github.event.release.tag_name != 'nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Options program
        run: |
          dotnet build src/Options/RaintileOptions.csproj -c Release -o build/options
          mkdir -p @Resources/Bin
          cp build/options/RaintileOptions.exe @Resources/Bin/

      - name: Build the .rmskin
        env:
          # passed through the environment, not pasted into the script
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            python3 tools/build_rmskin.py --version "$TAG"
          else
            python3 tools/build_rmskin.py
          fi

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.rmskin --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmskin
          path: dist/*.rmskin
