; =============================================================================
;  Raintile - launcher a tile per Rainmeter
;
;  Le impostazioni si modificano in  @Resources\Settings.inc
;  Categorie e tile: un file per categoria in  @Resources\Categories\
;
;  Il file @Resources\Generated\Grid.inc viene rigenerato automaticamente dallo
;  script quando cambiano NX, NY o l'elenco delle categorie: non modificarlo.
; =============================================================================

[Rainmeter]
; Nessun ciclo di aggiornamento: la skin ridisegna solo in risposta a eventi
; (click, scroll, hover). A riposo il consumo di CPU e' nullo.
Update=-1
AccurateText=1
DynamicWindowSize=0
; Porta la skin nell'angolo dello schermo e ricentra il menu a skin disegnata
; poi, in background, ricontrolla i file in Categories\ e crea le miniature mancanti
OnRefreshAction=[!Move "#ScreenX#" "#ScreenY#"][!CommandMeasure MeasureScript "Layout()"][!CommandMeasure MeasureCategoryList "Run"][!CommandMeasure MeasureScript "BuildThumbnails()"]
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
MouseScrollLeftAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollRightAction=[!CommandMeasure MeasureScript "Scroll(1)"]
ContextTitle=Cartella categorie
ContextAction=["#@#Categories"]
ContextTitle2=Impostazioni
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Cartella immagini
ContextAction3=["#@#Images"]

[Metadata]
Name=Raintile
Information=Launcher a griglia di tile divise per categorie, pensato per sostituire le icone del desktop.
Version=0.1.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeState=#@#State.inc

; -----------------------------------------------------------------------------
;  Stili
; -----------------------------------------------------------------------------

[StyleCategory]
FontFace=#FontFace#
FontSize=#MenuFontSize#
FontWeight=600
FontColor=#TextDimColor#
StringAlign=LeftCenter
AntiAlias=1
Group=Menu

[StyleCategoryIcon]
W=#MenuIconSize#
H=#MenuIconSize#
PreserveAspectRatio=1
ImageAlpha=#MenuIconDimAlpha#
Group=Menu

[StyleCategoryHit]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Menu
Hidden=1

[StyleCategoryPill]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Menu
Hidden=1

[StyleTile]
W=#TileW#
H=#TileH#
PreserveAspectRatio=2
SolidColor=#TileColor#
Group=Tiles
Hidden=1

[StyleTileIcon]
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
Group=Tiles
Hidden=1

[StyleTileLabel]
W=(#TileW#-2*#LabelPad#)
ClipString=1
FontFace=#FontFace#
FontSize=#LabelFontSize#
FontWeight=600
FontColor=#TextColor#
FontEffect=Shadow
FontEffectColor=0,0,0,200
StringAlign=LeftBottom
AntiAlias=1
Group=Tiles
Hidden=1

[StyleTileHover]
Shape=Rectangle 1,1,(#TileW#-2),(#TileH#-2) | Fill Color #HoverColor# | StrokeWidth 2 | Stroke Color #AccentColor#
Hidden=1

; -----------------------------------------------------------------------------
;  Script (aggiornato una sola volta al caricamento, poi solo via !CommandMeasure)
; -----------------------------------------------------------------------------

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Raintile.lua
UpdateDivider=-1

; Elenco dei file di categoria, letto in background a ogni caricamento
[MeasureCategoryList]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c dir /b /a-d "#@#Categories\*.ini"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureCategoryList][!CommandMeasure MeasureScript "OnCategoryList()"]

; Miniature di sfondi e loghi, create in background solo quando mancano
[MeasureThumbs]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Thumbs.ps1" "#@#Generated\Thumbs.txt"
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureScript "OnThumbnails()"]

; Tasto di chiusura (plugin HotKey). Il tasto resta registrato finche' la skin
; e' caricata: per questo, di default, il launcher si chiude dopo ogni avvio.
[MeasureCloseKey]
Measure=Plugin
Plugin=HotKey
HotKey=#CloseHotKey#
KeyDownAction=#CloseAction#

; -----------------------------------------------------------------------------
;  Meter
; -----------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#ScreenW#,#ScreenH# | Fill Color #BgColor# | StrokeWidth 0

; Evidenziazione della categoria attiva e di quella sotto il mouse
[CatPillHover]
Meter=Shape
MeterStyle=StyleCategoryPill

[CatPillActive]
Meter=Shape
MeterStyle=StyleCategoryPill

; Menu delle categorie e griglia di tile (generati dallo script)
[GridInclude]
@IncludeGrid=#@#Generated\Grid.inc

; Pulsante di chiusura in alto a destra (glifo "Cancel" di Segoe MDL2 Assets)
[MeterClose]
Meter=String
X=(#ScreenW#-#PadX#)
Y=(#PadY#+#MenuH#/2)
StringAlign=RightCenter
Text=[\xE711]
FontFace=Segoe MDL2 Assets
FontSize=#CloseSize#
FontColor=#TextDimColor#
SolidColor=0,0,0,1
Padding=10,10,10,10
AntiAlias=1
LeftMouseUpAction=#CloseAction#
MouseOverAction=[!SetOption MeterClose FontColor "#AccentColor#"][!UpdateMeter MeterClose][!Redraw]
MouseLeaveAction=[!SetOption MeterClose FontColor "#TextDimColor#"][!UpdateMeter MeterClose][!Redraw]

[MeterScrollBar]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Tiles
Hidden=1
