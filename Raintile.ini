; =============================================================================
;  Raintile - launcher a tile per Rainmeter
;
;  Le impostazioni si modificano in  @Resources\Settings.inc
;  Categorie e tile: un file per categoria in  @Resources\Categories\
;
;  Il file @Resources\Generated\Grid.inc viene rigenerato automaticamente dallo
;  script quando cambiano le griglie o l'elenco delle categorie: non modificarlo.
; =============================================================================

[Rainmeter]
; Nessun ciclo di aggiornamento: la skin ridisegna solo in risposta a eventi
; (click, scroll, hover). A riposo il consumo di CPU e' nullo.
Update=-1
AccurateText=1
DynamicWindowSize=0
; Porta la skin nell'angolo dello schermo e ricentra il menu a skin disegnata
; poi, in background, ricontrolla i file in Categories\ e crea le miniature mancanti
OnRefreshAction=[!Move "#ScreenX#" "#ScreenY#"][!CommandMeasure MeasureScript "Layout()"][!CommandMeasure MeasureCategoryList "Run"][!CommandMeasure MeasureScript "BuildThumbnails()"][!CommandMeasure MeasureScript "AutoImport()"][!CommandMeasure MeasureHelper "Run"]
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
MouseScrollLeftAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollRightAction=[!CommandMeasure MeasureScript "Scroll(1)"]
ContextTitle=Opzioni...
ContextAction=#OptionsAction#
ContextTitle5=Cartella categorie
ContextAction5=["#@#Categories"]
ContextTitle2=Impostazioni
ContextAction2=["#@#Settings.inc"]
ContextTitle3=Cartella immagini
ContextAction3=["#@#Images"]
ContextTitle4=Importa giochi dagli store
ContextAction4=[!CommandMeasure MeasureImport "Run"]

[Metadata]
Name=Raintile
Information=Launcher a griglia di tile divise per categorie, pensato per sostituire le icone del desktop.
Version=0.1.0

[Variables]
@IncludeSettings=#@#Settings.inc
@IncludeState=#@#State.inc
; Apre la finestra delle opzioni (nascondendo prima il launcher, che e' a
; schermo intero). conhost --headless avvia PowerShell senza nessuna finestra
; di console (con Windows Terminal come terminale predefinito, -WindowStyle
; Hidden lascerebbe una finestra vuota); non si usa RunCommand perche'
; chiuderebbe la finestra a ogni aggiornamento della skin.
; "#@#." evita che la barra finale chiuda le virgolette.
OptionsAction=[!CommandMeasure MeasureScript "Hide()"]["conhost.exe" --headless powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File "#@#Scripts\Options.ps1" -Resources "#@#." -Config "#ROOTCONFIG#"]

; -----------------------------------------------------------------------------
;  Stili
; -----------------------------------------------------------------------------

[StyleCategory]
FontFace=#FontFace#
FontSize=#MenuFontSize#
FontWeight=600
FontColor=#TextDimColor#
StringAlign=LeftCenter
AntiAlias=1
Group=Menu

[StyleCategoryIcon]
W=#MenuIconSize#
H=#MenuIconSize#
PreserveAspectRatio=1
ImageAlpha=#MenuIconDimAlpha#
Group=Menu

[StyleCategoryHit]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Menu
Hidden=1

[StyleCategoryPill]
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Menu
Hidden=1

[StyleTile]
Container=GridClip
W=#TileW#
H=#TileH#
PreserveAspectRatio=2
SolidColor=#TileColor#
Group=Tiles
Hidden=1

[StyleTileIcon]
Container=GridClip
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
Group=Tiles
Hidden=1

[StyleTileLabel]
Container=GridClip
W=(#TileW#-2*#LabelPad#)
ClipString=1
FontFace=#FontFace#
FontSize=#LabelFontSize#
FontWeight=600
FontColor=#TextColor#
FontEffect=Shadow
FontEffectColor=0,0,0,200
StringAlign=LeftBottom
AntiAlias=1
Group=Tiles
Hidden=1

[StyleTileHover]
Shape=Rectangle 1,1,(#TileW#-2),(#TileH#-2) | Fill Color #HoverColor# | StrokeWidth 2 | Stroke Color #AccentColor#
Hidden=1

; -----------------------------------------------------------------------------
;  Script (aggiornato una sola volta al caricamento, poi solo via !CommandMeasure)
; -----------------------------------------------------------------------------

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Raintile.lua
UpdateDivider=-1

; Elenco dei file di categoria, letto in background a ogni caricamento
[MeasureCategoryList]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/c dir /b /a-d "#@#Categories\*.ini"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureCategoryList][!CommandMeasure MeasureScript "OnCategoryList()"]

; Miniature di sfondi e loghi, create in background solo quando mancano
[MeasureThumbs]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Thumbs.ps1" "#@#Generated\Thumbs.txt"
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureScript "OnThumbnails()"]

; Import dei giochi installati dagli store (Steam, Epic, GOG, Ubisoft) nella
; categoria ImportCategory. "#@#." evita che la barra finale chiuda le virgolette.
[MeasureImport]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Import.ps1" -Resources "#@#." -Category "#ImportCategory#" -Stores "#ImportStores#" -SteamGridDBKey "#SteamGridDBKey#"
State=Hide
OutputType=ANSI
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureImport][!CommandMeasure MeasureScript "OnImport()"]

; Campo di testo della ricerca, sopra la barra in alto a sinistra (plugin
; InputText). Le parentesi lunghe di Lua [==[...]==] e le triple virgolette
; permettono di cercare anche testo con apici o virgolette.
[MeasureSearchInput]
Measure=Plugin
Plugin=InputText
X=(#PadX#+40)
Y=(#PadY#+(#MenuH#-#MenuFontSize#*2)/2)
W=(#SearchW#-56)
H=(#MenuFontSize#*2)
SolidColor=24,24,30,255
FontColor=#TextColor#
FontFace=#FontFace#
FontSize=#MenuFontSize#
FocusDismiss=1
DynamicVariables=1
UpdateDivider=-1
Command1=[!CommandMeasure MeasureScript """SearchSubmit([==[$UserInput$]==])"""]
OnDismissAction=[!CommandMeasure MeasureScript "SearchDismiss()"]

; Riaccende i tasti di navigazione poco dopo la ricerca, cosi' il rilascio di
; Invio (che ha confermato il testo) non avvia subito il primo risultato
[MeasureKeysDelay]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 300 | Ready
Ready=[!CommandMeasure MeasureScript "KeysReady()"]
UpdateDivider=-1

; Programma di supporto in background (Helper.ps1): gamepad (XInput) e
; chiusura alla perdita del focus. Una sola copia alla volta; con Gamepad=0 e
; AutoHide=0 chiude soltanto quella eventualmente in esecuzione.
[MeasureHelper]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#Scripts\Helper.ps1" -Gamepad #Gamepad# -AutoHide #AutoHide# -Config "#ROOTCONFIG#" -Toggle "#GamepadToggle#" -DeadZone #GamepadDeadZone# -RepeatDelay #GamepadRepeatDelay# -RepeatRate #GamepadRepeatRate#
State=Hide
UpdateDivider=-1

; Animazione di avvio: espansione della tile, attesa, chiusura (plugin ActionTimer)
[MeasureLaunchAnim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Step, 16, #LaunchAnimFrames# | Wait #LaunchHold# | Finish
Step=[!CommandMeasure MeasureScript "LaunchStep()"]
Finish=[!CommandMeasure MeasureScript "LaunchFinish()"]
UpdateDivider=-1

; Orologio delle animazioni (apertura, categoria, hover, scorrimento, Pan):
; ogni passo programma il successivo solo dopo aver disegnato (le due liste si
; alternano), cosi' i passi non si accodano mai; gira solo mentre qualcosa si
; muove
[MeasureAnim]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 16 | Tick1
ActionList2=Wait 16 | Tick2
Tick1=[!CommandMeasure MeasureScript "Tick(1)"]
Tick2=[!CommandMeasure MeasureScript "Tick(2)"]
UpdateDivider=-1

; Combinazione che apre e chiude il launcher (plugin HotKey). Resta attiva
; anche a launcher nascosto: la skin rimane sempre caricata.
[MeasureOpenKey]
Measure=Plugin
Plugin=HotKey
HotKey=#OpenHotKey#
KeyDownAction=[!CommandMeasure MeasureScript "Toggle()"]

; -----------------------------------------------------------------------------
;  Meter
; -----------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#ScreenW#,#ScreenH# | Fill Color #BgColor# | StrokeWidth 0

; Evidenziazione della categoria attiva e di quella sotto il mouse
[CatPillHover]
Meter=Shape
MeterStyle=StyleCategoryPill

[CatPillActive]
Meter=Shape
MeterStyle=StyleCategoryPill

; Area della griglia: fa da contenitore (Rainmeter 4.5+) e taglia le tile che
; durante lo scorrimento escono dai bordi. Le tile hanno coordinate relative.
[GridClip]
Meter=Shape
X=#PadX#
Y=(#PadY#+#MenuH#+#Gap#)
Shape=Rectangle 0,0,(#ScreenW#-2*#PadX#),(#ScreenH#-2*#PadY#-#MenuH#-#Gap#) | Fill Color 0,0,0,255 | StrokeWidth 0

; Menu delle categorie e griglia di tile (generati dallo script)
[GridInclude]
@IncludeGrid=#@#Generated\Grid.inc

; Evidenziazione della tile sotto il mouse (spostata dallo script)
[TileHover]
Meter=Shape
MeterStyle=StyleTileHover
Container=GridClip
Group=Tiles

; Barra di ricerca in alto a sinistra: lente (Segoe MDL2 Assets) + testo
[SearchPill]
Meter=Shape
X=#PadX#
Y=#PadY#
Shape=Rectangle 0,0,#SearchW#,#MenuH#,(#MenuH#/2) | Fill Color #HoverCategoryColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureScript "SearchOpen()"]
Group=Menu

[SearchText]
Meter=String
X=(#PadX#+16)
Y=(#PadY#+#MenuH#/2)
StringAlign=LeftCenter
W=(#SearchW#-32)
ClipString=1
Text=#SearchPlaceholder#
InlineSetting=Face | Segoe MDL2 Assets
InlinePattern=^(.)
Prefix="[\xE721]   "
FontFace=#FontFace#
FontSize=#MenuFontSize#
FontColor=#TextDimColor#
AntiAlias=1
Group=Menu

; Messaggio quando la ricerca non trova nulla
[SearchEmpty]
Meter=String
X=(#ScreenW#/2)
Y=(#ScreenH#/2)
StringAlign=CenterCenter
Text=Nessun risultato
FontFace=#FontFace#
FontSize=(#MenuFontSize#*2)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=1

; Pulsante delle opzioni, a sinistra della X (glifo "Settings")
[MeterOptions]
Meter=String
X=(#ScreenW#-#PadX#-#CloseSize#*3)
Y=(#PadY#+#MenuH#/2)
StringAlign=RightCenter
Text=[\xE713]
FontFace=Segoe MDL2 Assets
FontSize=#CloseSize#
FontColor=#TextDimColor#
SolidColor=0,0,0,1
Padding=10,10,10,10
AntiAlias=1
LeftMouseUpAction=#OptionsAction#
MouseOverAction=[!SetOption MeterOptions FontColor "#AccentColor#"][!UpdateMeter MeterOptions][!Redraw]
MouseLeaveAction=[!SetOption MeterOptions FontColor "#TextDimColor#"][!UpdateMeter MeterOptions][!Redraw]

; Pulsante di chiusura in alto a destra (glifo "Cancel" di Segoe MDL2 Assets)
[MeterClose]
Meter=String
X=(#ScreenW#-#PadX#)
Y=(#PadY#+#MenuH#/2)
StringAlign=RightCenter
Text=[\xE711]
FontFace=Segoe MDL2 Assets
FontSize=#CloseSize#
FontColor=#TextDimColor#
SolidColor=0,0,0,1
Padding=10,10,10,10
AntiAlias=1
LeftMouseUpAction=#CloseAction#
MouseOverAction=[!SetOption MeterClose FontColor "#AccentColor#"][!UpdateMeter MeterClose][!Redraw]
MouseLeaveAction=[!SetOption MeterClose FontColor "#TextDimColor#"][!UpdateMeter MeterClose][!Redraw]

[MeterScrollBar]
Meter=Shape
Shape=Rectangle 0,0,0,0 | StrokeWidth 0
Group=Tiles
Hidden=1

; Tile espansa durante l'avvio (sopra a tutto, posizionata dallo script)
[SplashBg]
Meter=Image
PreserveAspectRatio=2
Group=Splash
Hidden=1

[SplashLogo]
Meter=Image
PreserveAspectRatio=1
Group=Splash
Hidden=1

[SplashLabel]
Meter=String
StringAlign=CenterCenter
FontFace=#FontFace#
FontSize=#LaunchFontSize#
FontWeight=700
FontColor=#TextColor#
FontEffect=Shadow
FontEffectColor=0,0,0,200
AntiAlias=1
Group=Splash
Hidden=1
