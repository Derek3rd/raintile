; AudioControl: a Raintile custom widget (Widget=custom, Param=AudioControl).
; The basic sound settings of the PC, in two modes:
;   Devices  the playback devices, the default one lit, each with its volume:
;            a click on a device makes it the default one
;   Mixer    as Windows' volume mixer: the default device, System sounds and
;            each program playing sound, with its own volume; a click on one
;            mutes it
; The mode is the tile's widget setting (WidgetOption=Devices or Mixer; a
; list in the tile editor: WidgetOptionChoices= below), so two tiles can show
; one each. On every row: the bar (a click sets the volume there), - and +
; (by Step), the mouse wheel; a middle click mutes. The keys and the pad go
; from row to row; Enter / A does what a click on the row does, left and
; right change its volume (KeyLeftAction=, KeyRightAction=). Give the tile
; more cells for more rows.
;
; When its category comes on screen, OnShow starts AudioControl.ps1, which
; stays only while the widget is on screen (OnHide tells it to exit): it
; reads the devices and the programs (Windows' Core Audio) every DashInterval
; ms and, when something changed, sets the meters below with !SetOption. The
; clicks reach it through cmd_<section>.ini of the widget's folder
; (!WriteKeyValue), which it waits on.

[Metadata]
Name=Audio control
Information=The sound devices of the PC with their volume (a click makes one the default), or the volume of each program, as in Windows' volume mixer.

[Option:Step]
Label=Volume step
Kind=number
Default=5
Help=How much -, + and the mouse wheel change the volume, in %.

[Option:ShowTitle]
Label=Title
Kind=bool
Default=1
Help=A title at the top left of the tile, the rows under it.

[Option:Title]
Label=Title text
When=ShowTitle=1
Default=
Help=What the title says. Empty: Sound devices or Volume mixer, after the tile's mode.

; Sizes, from the tile's: AP the margin, AHF the title's font (as the other
; widgets'), ATop where the rows start, AF the rows' font, ANameH the line of
; a row's name, AS the - and + buttons, ABarH the bar, ARowH a row
[Variables]
AP=12
AHF=(Clamp(#WIDGETH#/18,9,20))
ATop=(#OPTION:ShowTitle#*(Clamp(#WIDGETH#/18,9,20)*2+12)+(1-#OPTION:ShowTitle#)*7)
AF=(Clamp(#WIDGETW#/26,8,12))
ANameH=(Clamp(#WIDGETW#/26,8,12)*2)
AS=(Clamp(#WIDGETW#/26,8,12)*1.7)
ABarH=(Max(4,Clamp(#WIDGETW#/26,8,12)*0.45))
ARowH=(Clamp(#WIDGETW#/26,8,12)*4.3)
ACmd=#WIDGETPATH#cmd_#WIDGET:Server#.ini

[Raintile]
WidgetOptionChoices=Devices|Mixer
OnShow=[!WriteKeyValue Cmd Do show "#ACmd#"][!CommandMeasure #WIDGET:Server# "Run"]
OnHide=[!WriteKeyValue Cmd Do quit "#ACmd#"]

[Server]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#WIDGETPATH#AudioControl.ps1" -Config "#CURRENTCONFIG#" -Section "#WIDGET:Server#" -Cmd "#ACmd#" -Mode "#WIDGETOPTION#" -Title "#OPTION:Title#" -Step "#OPTION:Step#" -Interval #DashInterval# -Rows 8 -Flag "#@#Generated\DashOn.txt" -Text "#TextColor#" -Dim "#TextDimColor#" -Accent "#AccentColor#"
State=Hide
OutputType=UTF8

; Set by AudioControl.ps1: how many rows, whether they have icons (Mixer)
[Count]
Measure=Calc
Formula=0

[IconOn]
Measure=Calc
Formula=0

[Vol1]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol2]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol3]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol4]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol5]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol6]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol7]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

[Vol8]
Measure=Calc
Formula=0
MinValue=0
MaxValue=100

; The title, small and dimmed at the top left like the ones of the other
; widgets (its text: the Title setting, else the mode's name, set by the script)
[Title]
Meter=String
X=#AP#
Y=10
W=(#WIDGETW#-#AP#*2)
ClipString=1
FontFace=#FontFace#
FontSize=#AHF#
FontColor=#TextDimColor#
AntiAlias=1
Text=#OPTION:Title#
Hidden=(1-#OPTION:ShowTitle#)

; Until the first rows (and without any)
[Empty]
Meter=String
X=#AP#
Y=#ATop#
W=(#WIDGETW#-#AP#*2)
ClipString=1
FontFace=#FontFace#
FontSize=#AF#
FontColor=#TextDimColor#
AntiAlias=1
Text=...
DynamicVariables=1
Hidden=([Count]>0)

; The rows: as many as there are devices or programs and as fit in the tile
; (the hidden ones are no parts). Each: the name (a part: a click picks the
; device / mutes the program; the keys and the pad go from row to row, left
; and right change its volume), its volume in %, then -, the bar, + (for
; the mouse).

[Hit1]
Meter=Shape
X=(#AP#/2)
Y=(#ATop#+0*#ARowH#)
Shape=Rectangle 0,0,(#WIDGETW#-#AP#),#ANameH#,4 | Fill Color 0,0,0,1 | StrokeWidth 0
Part=1
LeftMouseUpAction=[!WriteKeyValue Cmd Do "pick 1" "#ACmd#"]
KeyLeftAction=[!WriteKeyValue Cmd Do "down 1" "#ACmd#"]
KeyRightAction=[!WriteKeyValue Cmd Do "up 1" "#ACmd#"]
MouseScrollUpAction=[!WriteKeyValue Cmd Do "up 1" "#ACmd#"]
MouseScrollDownAction=[!WriteKeyValue Cmd Do "down 1" "#ACmd#"]
MiddleMouseUpAction=[!WriteKeyValue Cmd Do "mute 1" "#ACmd#"]
DynamicVariables=1
Hidden=((([Count]<1)+((#ATop#+1*#ARowH#)>(#WIDGETH#-4)))>0)

[Icon1]
Meter=Image
X=#AP#
Y=((#ATop#+0*#ARowH#)+#AF#*0.3)
W=(#AF#*1.4)
H=(#AF#*1.4)
PreserveAspectRatio=1
DynamicVariables=1
Hidden=((([Count]<1)+((#ATop#+1*#ARowH#)>(#WIDGETH#-4)))>0)

[Name1]
