; =============================================================================
;  Raintile - tasto di chiusura
;
;  Mini-skin invisibile che registra CloseHotKey (Esc) con il plugin HotKey.
;  Non va caricata a mano: la skin principale la attiva quando il launcher
;  viene mostrato e la disattiva quando viene nascosto, cosi' il tasto non
;  viene sottratto alle altre applicazioni a launcher chiuso.
; =============================================================================

[Rainmeter]
Update=-1

[Variables]
@Include=#@#Settings.inc

[MeasureCloseKey]
Measure=Plugin
Plugin=HotKey
HotKey=#CloseHotKey#
; chiude la ricerca se e' aperta, altrimenti nasconde il launcher
KeyDownAction=[!CommandMeasure MeasureScript "Escape()" "#ROOTCONFIG#"]

; Una skin deve avere almeno un meter: un pixel trasparente
[MeterDummy]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
