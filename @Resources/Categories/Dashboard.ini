; =============================================================================
;  Dashboard: a category of widgets (Type=Dashboard). Every section is a
;  widget; they update while the Dashboard is on screen (DashInterval).
;
;    Widget=        cpu, gpu, ram, disk, network, processes, system, temps,
;                   fans, skin, custom
;    Param=         disk: a drive (C) or empty for all of them
;                   processes: cpu or ram
;                   temps: HWiNFO sensor labels separated by ; (empty: CPU,
;                   GPU and drives)
;                   skin: an installed skin, <config>\<file>.ini
;                   custom: the name of a file in the Widgets folder of your
;                   data (Widgets\<name>.ini or Widgets\<name>\<name>.ini)
;    Label=         title shown instead of the default one
;    Command=       what a click opens (default: the tool that fits)
;
;  Temperatures and fans come from HWiNFO (free): keep it running with
;  "Shared Memory Support" on.
; =============================================================================

[Category]
Name=Dashboard
Type=Dashboard
Order=50
NX=4
NY=2

[CPU]
Widget=cpu

[GPU]
Widget=gpu

[Memory]
Widget=ram

[Network]
Widget=network

[Disks]
Widget=disk

[Processes]
Widget=processes

[Temperatures]
Widget=temps

[System]
Widget=system
