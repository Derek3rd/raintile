; =============================================================================
;  Dashboard: an example category of widgets (any tile of any category can
;  be one). They update while the category is on screen (DashInterval).
;
;    Widget=        cpu, gpu, ram, disk, network, processes, system, temps,
;                   fans, skin, custom
;    Param=         disk: a drive (C) or empty for all of them
;                   processes: cpu or ram
;                   temps: sensor labels separated by ; (empty: CPU,
;                   GPU and drives)
;                   skin: an installed skin, <config>\<file>.ini
;                   custom: the name of a file in the Widgets folder of your
;                   data (Widgets\<name>.ini or Widgets\<name>\<name>.ini)
;    Label=         title shown instead of the default one
;    Command=       what a click opens (default: the tool that fits)
;    Size=          cells taken, <columns>x<rows> (e.g. 2x2)
;    Opacity=       background of the tile, 0-100 (0 = none, e.g. for skins)
;
;  Temperatures and fans come from LibreHardwareMonitor (free, open source):
;  keep it running. Without it, from HWiNFO with "Shared Memory Support" on.
; =============================================================================

[Category]
Name=Dashboard
Order=50
NX=5
NY=4

[CPU]
Widget=cpu
Size=2x2

[GPU]
Widget=gpu
Size=2x2

[Memory]
Widget=ram
Size=1x2

[Network]
Widget=network

[Disks]
Widget=disk

[Temperatures]
Widget=temps
Size=2x2

[Processes]
Widget=processes
Size=1x2
