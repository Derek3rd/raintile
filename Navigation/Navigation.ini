; =============================================================================
;  Raintile - keyboard navigation
;
;  Invisible mini-skin that registers the navigation keys with the HotKey
;  plugin. Do not load it by hand: the main skin activates it when the
;  launcher is shown and deactivates it when it is hidden, so the keys (WASD,
;  arrows, Space, Enter, Q, E, F) are not taken away from other applications
;  while the launcher is closed. Keys are changed in Settings.inc.
; =============================================================================

[Rainmeter]
Update=-1

[Variables]
@Include=#@#Settings.inc

[MeasureKeyUp]
Measure=Plugin
Plugin=HotKey
HotKey=#NavUp#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,-1)" "#ROOTCONFIG#"]

[MeasureKeyUp2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavUp2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,-1)" "#ROOTCONFIG#"]

[MeasureKeyDown]
Measure=Plugin
Plugin=HotKey
HotKey=#NavDown#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,1)" "#ROOTCONFIG#"]

[MeasureKeyDown2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavDown2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(0,1)" "#ROOTCONFIG#"]

[MeasureKeyLeft]
Measure=Plugin
Plugin=HotKey
HotKey=#NavLeft#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(-1,0)" "#ROOTCONFIG#"]

[MeasureKeyLeft2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavLeft2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(-1,0)" "#ROOTCONFIG#"]

[MeasureKeyRight]
Measure=Plugin
Plugin=HotKey
HotKey=#NavRight#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(1,0)" "#ROOTCONFIG#"]

[MeasureKeyRight2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavRight2#
KeyDownAction=[!CommandMeasure MeasureScript "Nav(1,0)" "#ROOTCONFIG#"]

[MeasureKeyConfirm]
Measure=Plugin
Plugin=HotKey
HotKey=#NavConfirm#
; on release: no repeats while the key is held, and the release does not
; land in the middle of the launch animation or in the app just opened
KeyUpAction=[!CommandMeasure MeasureScript "Confirm()" "#ROOTCONFIG#"]
ShowAllKeys=#DebugLog#

[MeasureKeyConfirm2]
Measure=Plugin
Plugin=HotKey
HotKey=#NavConfirm2#
; on release: no repeats while the key is held, and the release does not
; land in the middle of the launch animation or in the app just opened
KeyUpAction=[!CommandMeasure MeasureScript "Confirm()" "#ROOTCONFIG#"]
ShowAllKeys=#DebugLog#

[MeasureKeyPrevCategory]
Measure=Plugin
Plugin=HotKey
HotKey=#NavPrevCategory#
KeyDownAction=[!CommandMeasure MeasureScript "NextCategory(-1)" "#ROOTCONFIG#"]

[MeasureKeyNextCategory]
Measure=Plugin
Plugin=HotKey
HotKey=#NavNextCategory#
KeyDownAction=[!CommandMeasure MeasureScript "NextCategory(1)" "#ROOTCONFIG#"]

[MeasureKeySearch]
Measure=Plugin
Plugin=HotKey
HotKey=#NavSearch#
; on release: the letter does not end up in the text field just opened
KeyUpAction=[!CommandMeasure MeasureScript "SearchOpen()" "#ROOTCONFIG#"]

; A skin needs at least one meter: a transparent pixel
[MeterDummy]
Meter=Image
W=1
H=1
SolidColor=0,0,0,1
