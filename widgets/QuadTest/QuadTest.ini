; QuadTest: a Raintile custom widget to try parts of a tile that are clicked
; and highlighted on their own (Widget=custom, Param=QuadTest). Four smaller
; tiles in a 2 x 2 grid, each starting a program. Give its tile Highlight=0:
; the parts highlight themselves, and Raintile's highlight stays off.
; #WIDGETW# and #WIDGETH# are the size of the tile, in pixels.
; #CURRENTSECTION# is the part itself (Raintile renames the sections).

[Variables]
QuadGap=8
QuadRadius=10
QuadFill=255,255,255,28
QuadHover=255,255,255,64
QuadStroke=0,210,180,255
QuadText=255,255,255,230

[QuadA]
Meter=Shape
X=(#QuadGap#+0*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))
Y=(#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))
Shape=Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 1,1,(((#WIDGETW#-3*#QuadGap#)/2)-2),(((#WIDGETH#-3*#QuadGap#)/2)-2),#QuadRadius# | Fill Color #QuadHover# | StrokeWidth 2 | Stroke Color #QuadStroke#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0"][!UpdateMeter #CURRENTSECTION#][!Redraw]
LeftMouseUpAction=["notepad.exe"]

[QuadALabel]
Meter=String
X=((#QuadGap#+0*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETW#-3*#QuadGap#)/2)/2)
Y=((#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETH#-3*#QuadGap#)/2)/2)
StringAlign=CenterCenter
FontFace=Segoe UI
FontSize=(#WIDGETH#/22)
FontWeight=600
FontColor=#QuadText#
AntiAlias=1
Text=Notepad

[QuadB]
Meter=Shape
X=(#QuadGap#+1*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))
Y=(#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))
Shape=Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0
MouseOverAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 1,1,(((#WIDGETW#-3*#QuadGap#)/2)-2),(((#WIDGETH#-3*#QuadGap#)/2)-2),#QuadRadius# | Fill Color #QuadHover# | StrokeWidth 2 | Stroke Color #QuadStroke#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# Shape "Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0"][!UpdateMeter #CURRENTSECTION#][!Redraw]
LeftMouseUpAction=["calc.exe"]

