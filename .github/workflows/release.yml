# Builds the .rmskin package (tools/build_rmskin.py) and attaches it to the
# release when a release is published. Run by hand (Actions > Release
# package > Run workflow) it only builds it, as a downloadable artifact.
#
# The release tag should be the version, e.g. v1.0.3, the same as Version= in
# Raintile.ini: if they differ the build stops, before attaching anything.

name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .rmskin
        env:
          # passed through the environment, not pasted into the script
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            python3 tools/build_rmskin.py --version "$TAG"
          else
            python3 tools/build_rmskin.py
          fi

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.rmskin --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmskin
          path: dist/*.rmskin
