; =============================================================================
;  Raintile - Rainside
;
;  One category of the launcher on a side of the screen, always there (or
;  coming out of its edge): RainsideCategory and the other Rainside settings.
;  Do not load it by hand: the launcher (Raintile.ini) loads it when
;  RainsideCategory names a category, refreshes it with itself and unloads it
;  when there is none. It is the launcher's own skin (included below) run by
;  the same script as a narrow bar: Instance.inc, in this folder, tells it so
;  and gives it its own generated files (Generated\Rainside*).
; =============================================================================

[Variables]
@IncludeLauncher=#ROOTCONFIGPATH#Raintile.ini

; What follows replaces the launcher's own: on load the Rainside only places
; and shows itself (the launcher does the setup, the scans, the update check,
; the helper)
[Rainmeter]
OnRefreshAction=[!CommandMeasure MeasureScript "PlaceWindow()"][!CommandMeasure MeasureScript "Layout()"]

[Metadata]
Name=Rainside
Information=A category of Raintile on a side of the screen, always there or coming out of its edge.

; Its key combination (RainsideHotKey): with RainsideMode=Edge it shows and
; hides it, with Fixed it gives it the keys and the gamepad (again: takes them back)
[MeasureOpenKey]
HotKey=#RainsideHotKey#
KeyDownAction=[!CommandMeasure MeasureScript "Toggle()"]

; RainsideMode=Edge: the mouse leaving it for a moment takes it back in
; (stopped when the mouse comes back)
[MeasureRainsideLeave]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 500 | Leave
Leave=[!CommandMeasure MeasureScript "RainsideLeave()"]
UpdateDivider=-1

; No top row (the script never shows it here): what the launcher shows
; before its script places it
[SearchPill]
Hidden=1

[SearchIcon]
Hidden=1

[SearchText]
Hidden=1

[MeterOptions]
Hidden=1

[MeterClose]
Hidden=1
