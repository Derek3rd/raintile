; =============================================================================
;  One file per category: the file name (without .ini) identifies the category
;  and its image folder, @Resources\Images\<file>\.
;
;  [Category]       menu entry (optional)
;    Name=          text shown (if empty: the file name)
;    Icon=          icon; if empty Images\<file>\icon.png|jpg is used
;    Order=         position in the menu (number); ties in alphabetical order
;    NX=, NY=       grid of the category (tiles visible per row and per
;                   column); if empty NX/NY from Settings.inc are used
;    IconSize=      logo size in this category's tiles (pixels or %)
;
;  Every other section is a tile, in file order. Images are found
;  automatically, using the section name:
;    Images\<file>\background\<TileName>.png|jpg|jpeg|bmp   background
;    Images\<file>\logo\<TileName>.png|jpg|jpeg|bmp         centred logo
;  So, with both images in place, this is enough:
;    [Diablo]
;    Command=steam://rungameid/2344520
;
;  Optional tile keys:
;    Command=       program, .lnk/.url shortcut, URL, folder, or bang
;    Image=         another name for both images (e.g. Image=diablo4 looks
;                   for background\diablo4.* and logo\diablo4.*)
;    Background=    specific background file (relative to background\ or an
;                   absolute path; the extension can be omitted)
;    Logo=          specific logo file (relative to logo\ or absolute)
;    Label=         text at the bottom left; tiles without images show the
;                   section name
;    Color=         background colour R,G,B,A when there is no image
;    Tags=          tags separated by commas (e.g. multiplayer, co-op): chips
;                   of the filter bar under the menu
;    Store=         store for the filter bar, if it cannot be told from the
;                   command (e.g. Store=GOG)
;
;  After a change: right click on the skin > Refresh skin.
; =============================================================================

[Category]
Name=Games
Order=1

[Steam]
Command=steam://open/games

; Example: with Images\Games\background\Diablo.jpg and Images\Games\logo\Diablo.png
; [Diablo]
; Command=steam://rungameid/2344520
