; QuadTest: a Raintile custom widget with parts (Widget=custom,
; Param=QuadTest). Four smaller tiles in a 2 x 2 grid, each starting a
; program. Part=1 on a meter makes it a part of the tile: Raintile's
; highlight goes onto it, with the same animation as between tiles, and a
; click runs the part's own LeftMouseUpAction.
; #WIDGETW# and #WIDGETH# are the size of the tile, in pixels.

[Variables]
QuadGap=8
QuadRadius=10
QuadFill=255,255,255,28
QuadText=255,255,255,230

[QuadA]
Meter=Shape
X=(#QuadGap#+0*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))
Y=(#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))
Shape=Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0
Part=1
LeftMouseUpAction=["notepad.exe"]

[QuadALabel]
Meter=String
X=((#QuadGap#+0*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETW#-3*#QuadGap#)/2)/2)
Y=((#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETH#-3*#QuadGap#)/2)/2)
StringAlign=CenterCenter
FontFace=Segoe UI
FontSize=(#WIDGETH#/22)
FontWeight=600
FontColor=#QuadText#
AntiAlias=1
Text=Notepad

[QuadB]
Meter=Shape
X=(#QuadGap#+1*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))
Y=(#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))
Shape=Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0
Part=1
LeftMouseUpAction=["calc.exe"]

[QuadBLabel]
Meter=String
X=((#QuadGap#+1*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETW#-3*#QuadGap#)/2)/2)
Y=((#QuadGap#+0*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETH#-3*#QuadGap#)/2)/2)
StringAlign=CenterCenter
FontFace=Segoe UI
FontSize=(#WIDGETH#/22)
FontWeight=600
FontColor=#QuadText#
AntiAlias=1
Text=Calculator

[QuadC]
Meter=Shape
X=(#QuadGap#+0*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))
Y=(#QuadGap#+1*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))
Shape=Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0
Part=1
LeftMouseUpAction=["explorer.exe"]

[QuadCLabel]
Meter=String
X=((#QuadGap#+0*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETW#-3*#QuadGap#)/2)/2)
Y=((#QuadGap#+1*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))+((#WIDGETH#-3*#QuadGap#)/2)/2)
StringAlign=CenterCenter
FontFace=Segoe UI
FontSize=(#WIDGETH#/22)
FontWeight=600
FontColor=#QuadText#
AntiAlias=1
Text=Explorer

[QuadD]
Meter=Shape
X=(#QuadGap#+1*(((#WIDGETW#-3*#QuadGap#)/2)+#QuadGap#))
Y=(#QuadGap#+1*(((#WIDGETH#-3*#QuadGap#)/2)+#QuadGap#))
Shape=Rectangle 0,0,((#WIDGETW#-3*#QuadGap#)/2),((#WIDGETH#-3*#QuadGap#)/2),#QuadRadius# | Fill Color #QuadFill# | StrokeWidth 0
Part=1
