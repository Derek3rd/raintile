# Nightly builds: on every push to the branch "nightly" (where the work goes;
# main gets it at the releases), the Options program and the .rmskin are
# built and published as the pre-release "nightly" (the previous one is
# replaced). Its version is the last release plus the number of commits
# since it: after v1.2.1, 1.2.1.1, 1.2.1.2, ... until the next release (1.2.2
# or 1.3.0) gathers them. Skins with UpdateChannel=Nightly are offered these
# builds; the others only see the releases ("latest" leaves pre-releases out).

name: Nightly

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: write

# one at a time: the newest push wins
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags and the commits since the last release

      - name: Nightly version
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          # the last release (its tag without the v); before any, Raintile.ini
          if [ -n "$last" ]; then
            base="${last#v}"
            count=$(git rev-list --count "$last"..HEAD)
          else
            base=$(python3 -c "import re;print(re.search(r'(?m)^\s*Version\s*=\s*([0-9.]+)', open('Raintile.ini', encoding='utf-8').read()).group(1))")
            count=$(git rev-list --count HEAD)
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "version=$base.$count" >> "$GITHUB_OUTPUT"
          echo "Nightly $base.$count (since ${last:-the start}: $count commits)"

      - name: Check the Options schema
        if: steps.version.outputs.count != '0'
        run: python3 tools/gen_options_schema.py --check

      - name: Build the Options program
        if: steps.version.outputs.count != '0'
        run: |
          dotnet build src/Options/RaintileOptions.csproj -c Release -o build/options
          mkdir -p @Resources/Bin
          cp build/options/RaintileOptions.exe @Resources/Bin/

      - name: Build the .rmskin
        if: steps.version.outputs.count != '0'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 tools/build_rmskin.py --nightly-version "$VERSION"

      - name: Publish the pre-release "nightly"
        if: steps.version.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          {
            echo "Nightly build $VERSION of \`${GITHUB_SHA::7}\`: not a release, for testing. Changes since ${LAST:-the start}:"
            echo
            if [ -n "$LAST" ]; then git log --no-merges --format='- %s' "$LAST"..HEAD | head -40; else git log --no-merges --format='- %s' -40; fi
          } > notes.md
          gh release delete nightly --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly dist/*.rmskin --prerelease --target "$GITHUB_SHA" \
            --title "Raintile nightly $VERSION" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
